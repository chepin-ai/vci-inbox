version: "v0.4"

project:
  name: "NsGalerkin — finite-dimensional Galerkin ODE truncation layer (2D Navier–Stokes)"
  description: >-
    Lean 4 formalization of the finite-dimensional Galerkin ODE truncation
    layer for 2D Navier–Stokes: abstract truncated system (coercive Stokes
    operator A, bilinear nonlinearity B with energy cancellation), local
    existence/uniqueness of the truncated ODE, explicit three-mode instance,
    explicit B bounds, and two certificate anchors (CAP anchor, zeta anchor).
    8 files, 51 declarations. Scope is strictly the finite-dimensional ODE
    truncation layer; no infinite-dimensional PDE seam is claimed here.
  authors: ["QF-OS Federation (枢/PIVOT-01 line)"]
  responsible_maintainers: ["枢/PIVOT-01"]
  license: "none (hosting repository unlicensed; CLASSIFY: L1 public-readable)"

sources:
  - title: "NS-PROOF-FRAME-01.md v1.1 (federation governance frame)"
    authors: ["QF-OS Federation"]
    id: "qf-os://vci-inbox/board/NS-PROOF-FRAME-01.md@58dfb9a94311"
    type: "original-proof"
    location: "§3.1 可证层"
    relationship: "formalizes"
    author_endorsement: "n/a"
    note: "内部治理帧；包与帧的逐条对照见 alignment 表。"
  - title: "C. Fefferman, Existence and smoothness of the Navier–Stokes equation (Clay Millennium Problem official statement, 2000)"
    id: "https://www.claymath.org/wp-content/uploads/2022/06/navierstokes.pdf"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "问题陈述背景；本包不声明证明或证伪其 (A)/(B)/(C)/(D) 任一款。"
  - title: "Finite time blowup for Navier–Stokes (OpenAI, 2026-09-08)"
    id: "https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "动机与术语背景；本包不形式化其主定理。其口径：自评已核、外部复现中、未颁奖。"

