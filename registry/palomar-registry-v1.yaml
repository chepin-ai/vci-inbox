policy:
  append_only: true
  append_only_statement: >-
    本表条目一经签发不删不改；修正、降级、除名一律以新条目追加，旧条目加
    superseded_by 指针保留，与册仓 append-only 并轨（WS-44 L4-4）。
  monotonicity: "D05 只升不降：定级只升不降；降级/除名唯一例外通道＝判定席裁定（SIDECAR-SCHEMA-T0T4-01 §4.3/§4.4）"
  language_discipline: >-
    禁领先语；OpenAI 相关成果口径固定为「自评已核、外部复现中、未颁奖」；
    时间戳一律 UTC(Z)，现状类断言携带「截至[日期]」钉（EXT18 卡6）。
  palomar_elements: ["40-hex commit pin", "三 SHA-256", "append-only", "nanoda 双核（或异构双核）", "LLM 二审"]
  registrar: "EXT-WAVE-18「攻」WS-C 攻坚线执行席（枢/PIVOT-01）"
  self_fingerprint: "未定——理由：自指哈希须于入册仓后由册仓 ledger 对定稿文件实测回填，禁预填"

# ---- 阶梯定义段（与 SIDECAR-SCHEMA-T0T4-01 §4.1 逐字对应）----
ladder:
  G0: {name: "declared",            requires: "T0 记录 1 条（自述声明，范围钉齐）"}
  G1: {name: "machine-attested",    requires: "T1 记录齐套（钉定工具链+依赖下三绿基线：build / sorry-scan / axiom-audit）"}
  G2: {name: "registry-witnessed",  requires: "T2 记录齐套（独立第三方见证逐字归档 + 40-hex 全钉 + 三 SHA-256 + 双核 + LLM 二审 + 本表签发）"}
  G3: {name: "externally-audited",  requires: "T3 记录齐套（联邦外署名审计，范围与局限入册）"}
  G4: {name: "author-endorsed",     requires: "T4 记录齐套（作者公开渠道背书，范围明示；T2 硬前置、T3 非硬前置）"}
  upgrade_ritual: "八步升级仪式：申请立案 → 证据冻结 → 机器复核 → 独立见证 → LLM 二审 → 判定席裁定（双轮律）→ append-only 登记 → 公告并轨"

