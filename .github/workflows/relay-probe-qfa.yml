name: relay-probe-qfa
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: QFA-PROBE-01 (QI_FULL_PAT中继;名单/计数/时间戳only,零值零PII)
        env:
          PAT: ${{ secrets.QI_FULL_PAT }}
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          python3 - <<'PYEOF'
          import json,os,datetime,urllib.request,urllib.error,base64,time
          def mk(t):
              def api(m,u,d=None):
                  r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+t,'Accept':'application/vnd.github+json','User-Agent':'qfa-probe'})
                  if d is not None: r.data=json.dumps(d).encode()
                  try:
                      x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
                  except urllib.error.HTTPError as e: return e.code,{}
              return api
          qi=mk(os.environ['PAT'])
          rep={'v':'QFA-PROBE-01','ts':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
          s,me=qi('GET','https://api.github.com/user'); rep['auth_as']=me.get('login') if s==200 else s
          s,repos=qi('GET','https://api.github.com/user/repos?per_page=100&affiliation=owner,collaborator')
          rep['visible_repos']=sorted({x['full_name'] for x in repos}) if s==200 else s
          out={}
          for full in [r for r in rep.get('visible_repos',[]) if 'qfa' in r.lower() or 'quantum' in r.lower()]:
              meta={}
              s,m=qi('GET','https://api.github.com/repos/'+full)
              if s==200: meta={'visibility':m.get('visibility'),'default':m.get('default_branch'),'pushed_at':m.get('pushed_at'),'archived':m.get('archived')}
              s,sec=qi('GET',f'https://api.github.com/repos/{full}/actions/secrets?per_page=100')
              meta['secrets']=[x['name'] for x in sec.get('secrets',[])] if s==200 else s
              s,runs=qi('GET',f'https://api.github.com/repos/{full}/actions/runs?per_page=5')
              meta['runs']=[{'n':x['name'],'c':x['conclusion'],'t':x['created_at']} for x in runs.get('workflow_runs',[])] if s==200 else s
              s,tree=qi('GET',f'https://api.github.com/repos/{full}/git/trees/HEAD?recursive=1')
              meta['paths']=[x['path'] for x in tree.get('tree',[]) if any(k in x['path'] for k in ('session','meta_engine','handoff','OTP','otp','workflow'))][:40] if s==200 else s
              out[full]=meta
          rep['targets']=out
          # 回执落vci-inbox桥(用Hub钥)
          import jwt
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'})
          IT=json.load(urllib.request.urlopen(rq))['token']; hub=mk(IT)
          path='bridge/qfa/QFA-PROBE-01.json'
          s,old=hub('GET','https://api.github.com/repos/chepin-ai/vci-inbox/contents/'+path)
          bd={'message':'QFA-PROBE-01回执','content':base64.b64encode(json.dumps(rep,ensure_ascii=False,indent=1).encode()).decode()}
          if s==200: bd['sha']=old['sha']
          s,r=hub('PUT','https://api.github.com/repos/chepin-ai/vci-inbox/contents/'+path,bd)
          print('receipt',s,'| auth_as',rep['auth_as'],'| targets',list(out.keys()))
          for k,v in out.items(): print(k, json.dumps(v,ensure_ascii=False)[:400])
          PYEOF
