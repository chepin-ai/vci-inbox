name: bridge-guard
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography
      - name: bidirectional guard IN/OUT
        env:
          CI_OPS_HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          GUARD_APP_KEY: ${{ secrets.GUARD_APP_KEY }}
        run: python bridge/scripts/guard.py
      - name: commit
        run: |
          git config user.name "bridge-guard[bot]"
          git config user.email "bridge-guard@chepin-ai.local"
          git add disc bridge
          if ! git diff --cached --quiet; then
            git commit -m "bridge-guard: sync $(date -u +%Y%m%d-%H%M)"
            for i in 1 2 3; do git pull --rebase -q origin HEAD 2>/dev/null; git push && break; sleep 5; done
          else
            echo "no changes"
          fi
