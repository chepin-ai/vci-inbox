name: bridge-guard
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyjwt cryptography
      - name: bidirectional guard IN/OUT
        env:
          GUARD_APP_KEY: ${{ secrets.GUARD_APP_KEY }}
        run: python bridge/scripts/guard.py
      - name: commit
        run: |
          git config user.name "bridge-guard[bot]"
          git config user.email "bridge-guard@chepin-ai.local"
          git add disc bridge
          if ! git diff --cached --quiet; then
            git commit -m "bridge-guard: sync $(date -u +%Y%m%d-%H%M)"
            git push
          else
            echo "no changes"
          fi
