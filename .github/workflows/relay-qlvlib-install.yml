name: relay-qlvlib-install
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: "QLVLIB-INSTALL-01: APP_ID/KEY内存中继+poller QF-OS升级+复跑回测"
        env:
          RELAY_PAT: ${{ secrets.AI_FULL_PAT }}
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          python3 -m pip install -q pynacl
          python3 - <<'PYEOF'
          import os, json, base64, urllib.request, urllib.error, time, re
          from nacl.public import PublicKey, SealedBox
          from nacl.encoding import Base64Encoder

          PAT=os.environ['RELAY_PAT']; HUBK=os.environ['HUBK']; HUBID=os.environ['HUBID']
          O='chepin-ai'; REPO='qlv-lib'; GH='https://api.github.com'
          T0=time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          def H(): return {'Authorization':'token '+PAT,'Accept':'application/vnd.github+json','User-Agent':'cisvr-relay'}
          def api(m,u,d=None):
              rq=urllib.request.Request(u,method=m,headers=H())
              if d is not None: rq.data=json.dumps(d).encode()
              try:
                  r=urllib.request.urlopen(rq,timeout=30); b=r.read().decode(); return r.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:200]

          rep={'relay':'QLVLIB-INSTALL-01','t0':T0,'steps':{}}
          # 1) AI_FULL_APP_KEY: HUBK密封直注(内存即焚,零打印零落盘)
          s,pk=api('GET',f'{GH}/repos/{O}/{REPO}/actions/secrets/public-key')
          assert s==200, 'pubkey '+str(s)
          sealed=SealedBox(PublicKey(pk['key'].encode(), Base64Encoder())).encrypt(HUBK.encode())
          s1,_=api('PUT',f'{GH}/repos/{O}/{REPO}/actions/secrets/AI_FULL_APP_KEY',
                   {'encrypted_value':base64.b64encode(sealed).decode(),'key_id':pk['key_id']})
          rep['steps']['AI_FULL_APP_KEY']=s1
          # 2) AI_FULL_APP_ID (var)
          s2,_=api('POST',f'{GH}/repos/{O}/{REPO}/actions/variables',{'name':'AI_FULL_APP_ID','value':HUBID})
          if s2==409:
              s2,_=api('PATCH',f'{GH}/repos/{O}/{REPO}/actions/variables/AI_FULL_APP_ID',{'name':'AI_FULL_APP_ID','value':HUBID})
          rep['steps']['AI_FULL_APP_ID']=s2
          # 3) poller.yml QF-OS升级: qf-beat直道+cron降死手(D-157清遗迹)
          s3,c3=api('GET',f'{GH}/repos/{O}/{REPO}/contents/.github/workflows/qlv-lib-poller.yml')
          assert s3==200, 'yml read '+str(s3)
          cur=base64.b64decode(c3['content']).decode()
          new=cur.replace('  workflow_dispatch:\n','  workflow_dispatch:\n  repository_dispatch:\n    types: [qf-beat]\n',1)
          new=new.replace('- cron: "*/15 * * * *"','- cron: "*/15 * * * *"  # 死手兜底(D-157): 主驱动=qf-beat事件道',1)
          assert new!=cur, 'yml replace no-op'
          s4,_=api('PUT',f'{GH}/repos/{O}/{REPO}/contents/.github/workflows/qlv-lib-poller.yml',
                   {'message':'D-157 qf-beat直道+cron降死手(relay QLVLIB-INSTALL-01)','content':base64.b64encode(new.encode()).decode(),'sha':c3['sha']})
          rep['steps']['poller_yml_qfbeat']=s4
          # 4) dispatch poller复跑
          s5,_=api('POST',f'{GH}/repos/{O}/{REPO}/actions/workflows/qlv-lib-poller.yml/dispatches',{'ref':'main'})
          rep['steps']['dispatch_poller']=s5
          # 5) 轮询回测: receipts_last.jsonl 新回执
          ver='PENDING'; detail={}
          for _ in range(9):
              time.sleep(20)
              s6,c6=api('GET',f'{GH}/repos/{O}/{REPO}/contents/receipts_last.jsonl')
              if s6!=200: continue
              txt=base64.b64decode(c6['content']).decode()
              m=re.search(r'"ts": "([^"]+)"', txt); r=re.search(r'"result": (\{[^}]+\})', txt)
              if m and r and m.group(1)>=T0.replace('Z','')[:19]:
                  detail={'receipt_ts':m.group(1),'result':json.loads(r.group(1))}
                  ver='PASS' if detail['result'].get('AI_FULL_APP_KEY')=='present' and detail['result'].get('AI_FULL_APP_ID')=='present' else 'PARTIAL'
                  break
          rep['verify']=ver; rep['cred_selftest']=detail
          rep['otp3']='PENDING-ROOT(OTP_PHONE/OTP_EMAIL1/OTP_EMAIL2 值源=root,胶囊道已备)'
          print('RELAY-RECEIPT '+json.dumps(rep,ensure_ascii=False))
          PYEOF
