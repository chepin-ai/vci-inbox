name: BLUEQUBIT-LOGIN-01
# 量子云登录探针(beat133): BlueQubit email+PW整对凭证 playwright真实登录 (值永不打印)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  login-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright && playwright install --with-deps chromium
      - name: bluequbit login probe
        env:
          BQ_EMAIL: ${{ secrets.BLUEQUBIT_GMAIL }}
          BQ_PW: ${{ secrets.BLUEQUBIT_PW }}
        run: |
          python3 - <<'PY'
          import json, datetime, os
          from playwright.sync_api import sync_playwright
          rep={'schema':'BLUEQUBIT-LOGIN-01','ts':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
          try:
              with sync_playwright() as p:
                  br=p.chromium.launch(headless=True)
                  pg=br.new_page()
                  pg.goto('https://app.bluequbit.io/login',timeout=60000,wait_until='networkidle')
                  rep['page']='loaded'
                  rep['title']=pg.title()
                  # cookie横幅先决
                  try:
                      for bs in ['button:has-text("Reject All")','button:has-text("Accept All")']:
                          el=pg.query_selector(bs)
                          if el: el.click(); pg.wait_for_timeout(2500); rep['cookie']='dismissed'; break
                  except Exception: pass
                  # 着陆页→登录表单页
                  try:
                      for ls in ['a:has-text("Log in")','text=Log in','a[href*="login"]']:
                          el=pg.query_selector(ls)
                          if el: el.click(); pg.wait_for_timeout(4000); rep['nav']='clicked'; break
                  except Exception: pass
                  # SPA渲染等待+现场勘定
                  try: pg.wait_for_selector('input[type="password"]',timeout=20000)
                  except Exception: pass
                  rep['inputs']=[{'type':i.get_attribute('type'),'name':i.get_attribute('name'),'ph':i.get_attribute('placeholder')} for i in pg.query_selector_all('input')]
                  rep['buttons']=[b.inner_text()[:30] for b in pg.query_selector_all('button')][:8]
                  email_sel='input[type="email"], input[name="email"], input[name="username"], input[placeholder*="mail" i]'
                  pw_sel='input[type="password"]'
                  if pg.query_selector(email_sel) and pg.query_selector(pw_sel):
                      rep['form']='found'
                      pg.fill(email_sel, os.environ['BQ_EMAIL'])
                      pg.fill(pw_sel, os.environ['BQ_PW'])
                      try:
                          pg.press(pw_sel,'Enter')
                      except Exception:
                          pg.click('form button, button[type="submit"]',timeout=10000)
                      pg.wait_for_timeout(10000)
                      rep['post_url']=pg.url
                      rep['post_body']=pg.inner_text('body')[:300]
                      body_low=rep['post_body'].lower()
                      rep['auth_markers']={'api_token_link':'see api token' in body_low,'app_nav':all(k in body_low for k in ('playground','docs')),'tour':'starts a tour' in body_low}
                      rep['login_ok']=bool(rep['auth_markers']['api_token_link'] or (rep['auth_markers']['app_nav'] and 'sign up' not in body_low))
                      rep['err_boxes']=[e.inner_text()[:80] for e in pg.query_selector_all('[role="alert"], .error, .MuiAlert-message, [class*="error" i]')][:4]
                      rep['login_ok_url']='login' not in pg.url.lower()  # URL断言降级为旁证(毂错#11:SPA断言行序案)
                      if rep['login_ok']:
                          rep['dashboard_hint']=pg.title()
                  else:
                      rep['form']='not-found'
                      rep['body_hint']=pg.inner_text('body')[:200]
                  br.close()
          except Exception as e:
              rep['error']=f'{type(e).__name__}:{str(e)[:120]}'
          rep['note']='诚实探针:login_ok=布尔断言;失败即负结果入册,不伪报'
          open('probe.json','w').write(json.dumps(rep,ensure_ascii=False,indent=2)); print(json.dumps(rep))
          PY
      - name: commit receipt
        run: |
          mkdir -p receipts && cp probe.json receipts/BQ-LOGIN-$(date -u +%Y%m%dT%H%M%SZ).json
          git config user.name "hub-bot"; git config user.email "hub@ci-mesh"
          git add receipts/
          git commit -m "BLUEQUBIT-LOGIN-01 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 3; done; exit 1
