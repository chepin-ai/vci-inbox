name: quota-guard
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quota-guard
  cancel-in-progress: false
jobs:
  meter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: install pyjwt
        run: pip install -q pyjwt
      - name: meter private-surface billable minutes (incremental watermark + hash-chain; monitor-only until root 配额重排授权)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import time,json,os,datetime,urllib.request,urllib.error,hashlib
          import jwt
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'quota-guard'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          def api(u):
              r=urllib.request.Request(u,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','User-Agent':'quota-guard'})
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,{}
          PRIV=['ci-control','ci-control-backup','ci-library','ci-logs','ci-inbox','ci-bus','ci-playground','ci-build','qlv-lab']
          st={'watermark':'2026-08-01T00:00:00Z','period_ms':0,'chain':'GENESIS'}
          def getc(repo,path):
              r=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); import base64 as b64; return json.loads(b64.b64decode(json.loads(x.read().decode())['content']).decode())
              except Exception: return None
          prev_st=getc('ci-control','bridge/quota/state.json')
          if prev_st: st=prev_st
          new_ms=0; day_ms=0; scanned=0
          day_ago=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=24)).strftime('%Y-%m-%dT%H:%M:%SZ')
          for repo in PRIV:
              page=1
              while page<=3:
                  s,d=api(f'https://api.github.com/repos/chepin-ai/{repo}/actions/runs?per_page=100&page='+str(page))
                  if s!=200: break
                  runs=d.get('workflow_runs',[])
                  if not runs: break
                  oldest=None
                  for rn in runs:
                      ca=rn['created_at']
                      if ca<st['watermark'] and ca<day_ago: continue
                      s2,t2=api(f"https://api.github.com/repos/chepin-ai/{repo}/actions/runs/{rn['id']}/timing")
                      scanned+=1
                      if s2!=200: continue
                      ms=sum(v.get('total_ms',0) for v in t2.get('billable',{}).values())
                      if ca>=st['watermark']: new_ms+=ms
                      if ca>=day_ago: day_ms+=ms
                      oldest=ca
                  if len(runs)<100 or (oldest and oldest<st['watermark'] and oldest<day_ago): break
                  page+=1
          st['period_ms']+=new_ms
          st['watermark']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          BUDGET_MS=2000*60000
          pct=round(100*st['period_ms']/BUDGET_MS,2)
          rec={'ts':st['watermark'],'day_min':round(day_ms/60000,1),'period_min':round(st['period_ms']/60000,1),
               'pct_of_2000':pct,'scanned_runs':scanned,'prev':st['chain']}
          h=hashlib.sha256(json.dumps(rec,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          rec['hash']=h; st['chain']=h
          def putc(repo,path,obj,msg):
              import base64 as b64
              r=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              sha=None
              try:
                  x=urllib.request.urlopen(r); sha=json.loads(x.read().decode()).get('sha')
              except Exception: pass
              body={'message':msg,'content':b64.b64encode(json.dumps(obj,ensure_ascii=False,indent=1).encode()).decode()}
              if sha: body['sha']=sha
              rq=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(body).encode())
              urllib.request.urlopen(rq)
          oldlog=getc('ci-control','bridge/quota/log-list.json') or []
          oldlog.append(rec)
          putc('ci-control','bridge/quota/log-list.json',oldlog,'quota-guard log+1')
          putc('ci-control','bridge/quota/state.json',st,'quota-guard state')
          print(json.dumps(rec,ensure_ascii=False))
          # ⑤abc 熔断(已授权 RATIFICATION-02): enforce模式
          if pct>=90:
              WL={'wall-probe.yml'}
              sW,dW=api(f'https://api.github.com/repos/chepin-ai/ci-control/actions/workflows') if False else (None,None)
              for repo in PRIV:
                  sW,dW=api(f'https://api.github.com/repos/chepin-ai/{repo}/actions/workflows?per_page=100')
                  if sW!=200: continue
                  for w in dW.get('workflows',[]):
                      if w['state']=='active' and w['path'].split('/')[-1] not in WL:
                          api2='https://api.github.com/repos/chepin-ai/%s/actions/workflows/%s/disable'%(repo,w['id'])
                          rQ=urllib.request.Request(api2,method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
                          try: urllib.request.urlopen(rQ); print('⑤a熔断:',repo,w['path'])
                          except Exception as e: print('熔断fail',repo,e)
          if pct>=70:
              sev='CRITICAL' if pct>=90 else 'WARN'
              import urllib.request as u2
              rb=u2.Request('https://api.github.com/repos/chepin-ai/vci-inbox/issues/1/comments',method='POST',
                  headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'},data=json.dumps(
                  {'body':f"[quota-guard/{sev}] 周期用量 {rec['period_min']}/2000 min ({pct}%)。monitor-only;熔断授权候 root D-068。"}).encode())
              try: u2.urlopen(rb)
              except Exception as e: print('alert fail',e)
          PYEOF
      - name: daily report (LLM实测段+配额段→私仓;日报制度复活)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,datetime,urllib.request,urllib.error,base64
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          B='https://api.github.com/repos/chepin-ai'
          def gh(u):
              r=urllib.request.Request(u,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,{}
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          day=ts[:10]
          lines=['# DAILY-REPORT '+day+' (quota-guard日tick)\n','ts: '+ts+'\n']
          lines.append('## LLM实测\n')
          for repo,fn in [('vci-playground','bench-qlv.yml'),('ci-yard','yard-llm-bench.yml')]:
              s,w=gh(f'{B}/{repo}/actions/workflows?per_page=100')
              wid=[x['id'] for x in w.get('workflows',[]) if x['path'].endswith(fn)] if s==200 else []
              if wid:
                  s2,rr=gh(f'{B}/{repo}/actions/workflows/{wid[0]}/runs?per_page=5')
                  for r0 in rr.get('workflow_runs',[]):
                      lines.append(f"- {repo}/{fn}: {r0['conclusion']} {r0['created_at']}\n")
          s6,dj=gh(f'{B}/ci-control/contents/bridge/DIRECTIVES.json')
          if s6==200:
              dj2=json.loads(base64.b64decode(dj['content']).decode())
              its=dj2.get('items',[])
              done=len([i for i in its if i.get('state')=='done']); op=len([i for i in its if i.get('state')=='open'])
              lines.append('## 目标达成率(G3)\n')
              lines.append(f'- done={done} open={op} 达成率={done*100//max(1,done+op)}%\n')
          lines.append('## 配额\n')
          s3,st=gh(f'{B}/ci-control/contents/bridge/quota/state.json')
          if s3==200:
              stj=json.loads(base64.b64decode(st['content']).decode())
              lines.append(f"- period_min={stj.get('period_ms',0)/60000:.1f} / 2000\n")
          s4,bc=gh(f'{B}/ci-control/contents/bridge/beacon/BEACON.json')
          if s4==200:
              bcj=json.loads(base64.b64decode(bc['content']).decode())
              lines.append(f"\n## 信标 seq={bcj.get('seq')} mode={bcj.get('mode')}\n")
          body={'message':'daily report '+day,'content':base64.b64encode(''.join(lines).encode()).decode()}
          s5,old=gh(f'{B}/ci-control/contents/bridge/reports/daily-{day}.md')
          if s5==200: body['sha']=old['sha']
          rq=urllib.request.Request(f'{B}/ci-control/contents/bridge/reports/daily-{day}.md',method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(body).encode())
          urllib.request.urlopen(rq)
          print('daily report written',day)
          PYEOF
      # 公仓零落:产物已全量进 ci-control(CLASSIFY-01,D-072)
