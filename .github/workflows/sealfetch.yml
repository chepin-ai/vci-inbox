name: SEALFETCH-01
on:
  workflow_dispatch:
    inputs:
      secret_name:
        required: true
        default: 'OTP_PHONE'
permissions:
  contents: write
jobs:
  sealfetch:
    runs-on: ubuntu-latest
    steps:
      - name: seal
        env:
          SECRET_VALUE: ${{ secrets[github.event.inputs.secret_name] }}
          NAMEIN: ${{ github.event.inputs.secret_name }}
          PUBPEM: ${{ github.event.inputs.secret_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, base64, subprocess, datetime
          pem = """-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAsR0AZU7JsAq8viSl7UC4
h2k3fyouajUnvzb8bnzu2UNYJ+ayDRBEQbC2HRMIki0P2K8a1aqCb8UrcClg1ksU
dKNe1/w5jZPs3DyXWRnFCvzCtsaiUZBk3RUAkwqniMrAZ2VaARwFF1wBVVBP4/T0
7G10nYXsf29h5NPK20wkpyU7OuTwYoZhLa1uw8lCl8aQ4DtlnSgI2oCuRGcvZoje
Ln38n/FboUP4xyYyccD6btubwR2Ci6r3tMjocHDLZFvntnMVHpoUiRQe8C6yDro2
aguMc5ns942U2lMCQE8HjaYH3PX2xKWpY4wLen+pIoKSmyW38JHJJOV6gtP00VlF
emo9HXHlSJ3XZrPxm4M/YUZSkFiZIDthFsiPZ77Nf4VxNEWVQzAYGaExMO2xNsmr
RY0HaiOijUx4KgeJHQlv+wWs1G9dP24ansv00KqRsOVEEhwiR2rf/tRQ3mvAEGw+
ilyLEV7EIMhW29r/ZVZD0ygz4MY6XeVBmSzPPmAJqfBVJ+f8J9csqtu5ahv4weWW
xFRMxYQFkDqxoLM29lRndBHev+1S7QZ8InnzQ8OnVtuonrknn4UsGWbjFNQ05BuH
jWlIYtSesLVLBbc3AuHivMx0TlIdob00XIHSF4vjuUzEhqPkMW12fXNFmeBEcVPA
/8IIR+dmpQvSMiENDXVKtV0CAwEAAQ==
-----END PUBLIC KEY-----
"""
          open('/tmp/pubk.pem','w').write(pem)
          val = os.environ['SECRET_VALUE']
          assert val, 'empty secret'
          enc = subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','/tmp/pubk.pem',
              '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],
              input=val.encode(), capture_output=True)
          assert enc.returncode==0, enc.stderr.decode()
          doc = {'v':'SESSDELIV-SEALED','alg':'RSA-OAEP-SHA256','pubkey_fp':'eaf972ab8cd2',
                 'ts': datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ'),
                 'secret_name': os.environ['NAMEIN'],
                 'b64': base64.b64encode(enc.stdout).decode()}
          json.dump(doc, open('sealed-out.json','w'), ensure_ascii=False, indent=1)
          print('sealed:', len(enc.stdout))
          PYEOF
      - name: push
        run: |
          git init -q . 2>/dev/null || true
          git config user.name lvlu-ops
          git config user.email lvlu@ci.ops
          mkdir -p research
          mv sealed-out.json research/SEALFETCH-OUT.json
          git add research/SEALFETCH-OUT.json
          git commit -q -m "[skip ci] sealfetch ${GITHUB_RUN_ID}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
