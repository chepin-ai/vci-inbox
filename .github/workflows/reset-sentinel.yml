name: reset-sentinel
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reset-sentinel
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install pyjwt
        run: pip install -q pyjwt
      - name: probe wall & report-only (D-068 root裁决:私仓CI只做应急响应,禁自动复启)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import time,json,os,datetime,urllib.request,urllib.error
          import jwt
          key=os.environ['HUB_KEY']; appid=os.environ['HUB_ID']
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':str(appid)},key,algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'reset-sentinel'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          def api(m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','User-Agent':'reset-sentinel'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,{}
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          import base64 as _b64
          def getc(repo,path):
              r=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); return json.loads(_b64.b64decode(json.loads(x.read().decode())['content']).decode())
              except Exception: return None
          def putc(repo,path,obj,msg):
              r=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              sha=None
              try:
                  x=urllib.request.urlopen(r); sha=json.loads(x.read().decode()).get('sha')
              except Exception: pass
              bd={'message':msg,'content':_b64.b64encode(json.dumps(obj,ensure_ascii=False,indent=1).encode()).decode()}
              if sha: bd['sha']=sha
              rq=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(bd).encode())
              urllib.request.urlopen(rq)
          mf=getc('ci-control','bridge/governor/wall-manifest.json')
          pid=mf['wall_probe']['id']
          log={'ts':ts,'mode':'report-only(D-068)'}
          s1,_=api('PUT','https://api.github.com/repos/chepin-ai/ci-control/actions/workflows/'+str(pid)+'/enable')
          time.sleep(5)
          s2,_=api('POST','https://api.github.com/repos/chepin-ai/ci-control/actions/workflows/'+str(pid)+'/dispatches',{'ref':'main'})
          log['enable']=s1; log['dispatch']=s2
          time.sleep(150)
          s3,d3=api('GET','https://api.github.com/repos/chepin-ai/ci-control/actions/workflows/'+str(pid)+'/runs?per_page=1')
          open_wall=False
          if s3==200 and d3.get('workflow_runs'):
              run=d3['workflow_runs'][0]
              s4,d4=api('GET','https://api.github.com/repos/chepin-ai/ci-control/actions/runs/'+str(run['id'])+'/jobs')
              if s4==200 and d4.get('jobs'):
                  jb=d4['jobs'][0]
                  open_wall = len(jb.get('steps',[]))>0 and jb.get('conclusion')=='success'
                  log['run']=run['id']; log['steps']=len(jb.get('steps',[])); log['concl']=jb.get('conclusion')
          log['wall']='OPEN' if open_wall else 'CLOSED'
          if open_wall:
              n=len(mf['disabled'])
              body=('[reset-sentinel/D-068] 墙已开 '+ts+' UTC。按 root 裁决:不自动复启。\n'
                    'manifest 冻结清单共 '+str(n)+' 只(=停机时刻活跃集,非应然设计),逐只候 root 裁决。\n'
                    '应急授权方式:root 在 lobby #1 回 [CMD] 白名单(repo+workflow 名),cisvr 按白名单逐只启用并回证。\n'
                    '本守护本轮任务完成,自停;下周期由 root 或 cisvr 手动 workflow_dispatch 重启。')
              api('POST','https://api.github.com/repos/chepin-ai/vci-inbox/issues/1/comments',{'body':body})
              api('PUT','https://api.github.com/repos/chepin-ai/vci-inbox/actions/workflows/reset-sentinel.yml/disable')
              putc('ci-control','bridge/governor/wall-state.json',{'state':'OPEN-REPORTED','ts':ts,'restored':0,'policy':'report-only'},'wall OPEN-REPORTED')
          else:
              api('PUT','https://api.github.com/repos/chepin-ai/ci-control/actions/workflows/'+str(pid)+'/disable')
              putc('ci-control','bridge/governor/wall-state.json',{'state':'CLOSED','ts':ts,'last_probe':log},'wall CLOSED')
          oldlog=getc('ci-control','bridge/governor/wall-probe-log.json') or []
          oldlog.append(log)
          putc('ci-control','bridge/governor/wall-probe-log.json',oldlog,'wall-probe log+1')
          print(json.dumps(log,ensure_ascii=False)[:400])
          PYEOF
      # 公仓零落:产物全进 ci-control(CLASSIFY-01,D-072)
