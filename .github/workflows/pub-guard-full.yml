name: pub-guard-full
on:
  workflow_dispatch:
    inputs:
      target:
        description: "all | 任一公仓名"
        required: true
        default: "all"
  workflow_run:
    workflows: [kernel-loop]
    types: [completed]   # R1存量巡事件化: 附kernel-loop拍尾,skip-ci不可绕;内闸≥6h一拍
permissions:
  contents: write
  # rationale: R1现行层全树代号化批处理——增量pub-guard只审push改动面且被[skip ci]绕过,存量/绕行违规由此4h巡清(D-127/D-134);rules表L2私存运行时拉取
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "R1 现行层全树代号化"
        env:
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
          TGT: ${{ github.event.inputs.target || 'all' }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF'
          import os,json,urllib.request,datetime,base64,subprocess,re,time
          HK=os.environ['HUBK']; HID=os.environ['HUBID']
          _st=urllib.request.Request('https://api.github.com/repos/chepin-ai/vci-inbox/contents/bridge/guard/last-sweep.json',headers={'Authorization':'token '+os.environ.get('GHB','') or HK,'Accept':'application/vnd.github+json','User-Agent':'pgf'})
          try:
              _d=json.loads(urllib.request.urlopen(_st,timeout=15).read().decode())
              _age=time.time()-datetime.datetime.fromisoformat(json.loads(base64.b64decode(_d['content']).decode())['ts'].replace('Z','+00:00')).timestamp()
              if _age<6*3600 and os.environ.get('TGT','all')=='all': print('sweep throttled, age %.0fs'%_age); raise SystemExit(0)
          except SystemExit: raise
          except Exception as _e: print('throttle check skip',_e)
          PUBS=['vci-inbox','vci-usrm','vci-library','vci-qgl','vci-cfts','vci-vinf','vci-ucif2','ci-worker-01-','ci-worker-02']
          TARGETS=PUBS if os.environ.get('TGT','all')=='all' else [os.environ['TGT']]
          import jwt as JW
          now=int(datetime.datetime.now().timestamp())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':HID},HK,algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'pub-guard-full'})
          IT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          rq2=urllib.request.Request('https://api.github.com/repos/chepin-ai/ci-control/contents/bridge/PUB-LINT-RULES.json',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
          RU=json.loads(base64.b64decode(json.loads(urllib.request.urlopen(rq2,timeout=20).read().decode())['content']).decode())
          pats=sorted(RU['feat_classes']['repo_names']+RU['feat_classes']['cred_names']+RU['feat_classes']['internal_ids'],key=len,reverse=True)
          cm=RU['codename']; allow=tuple(RU['allowlist_paths'])
          rx=[(p,re.compile(r'(?<![\w/-])(?<!\.)'+re.escape(p)+r'(?![\w-])(?!/)')) for p in pats]
          def run(c,**kw): return subprocess.run(c,capture_output=True,text=True,**kw)
          for TGT in TARGETS:
              ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              os.chdir('/tmp')
              run(['rm','-rf','/tmp/pgf'])
              r=run(['git','clone',f'https://x-access-token:{IT}@github.com/chepin-ai/{TGT}.git','/tmp/pgf'])
              if r.returncode!=0: print(TGT,'clone fail',r.stderr[-200:]); continue
              os.chdir('/tmp/pgf')
              SKIP=('.png','.jpg','.lock','.enc','.qf','.woff','.woff2','.ttf','.ico','.map','.pdf')
              files=[p for p in run(['git','ls-files']).stdout.split() if not p.startswith(allow) and not p.endswith(SKIP)]
              fixed=[]; skipped=0
              for p in files:
                  try: txt=open(p,encoding='utf-8').read()
                  except Exception: skipped+=1; continue
                  out=txt
                  for p0,r0 in rx: out=r0.sub(cm.get(p0,'〈RED〉'),out)
                  if out!=txt:
                      open(p,'w',encoding='utf-8').write(out); fixed.append(p)
              os.makedirs('bridge/guard',exist_ok=True)
              rep={'ts':ts,'target':TGT,'mode':'full-tree','scanned':len(files)-skipped,'fixed_n':len(fixed),'fixed':fixed}
              open('bridge/guard/pub-lint-full-latest.json','w').write(json.dumps(rep,ensure_ascii=False,indent=1))
              run(['git','config','user.name','pub-guard']); run(['git','config','user.email','guard@local'])
              run(['git','add','-A'])
              if run(['git','diff','--cached','--quiet']).returncode!=0:
                  run(['git','commit','-q','-m',f'pub-guard-full: R1现行层代号化 {len(fixed)}件 + 报告 [skip ci]'])
                  ok=False
                  for i in range(3):
                      if run(['git','pull','--rebase','-q']).returncode==0 and run(['git','push','-q']).returncode==0: ok=True; break
                      time.sleep(3+i*3)
                  print(TGT,'pushed',ok,'fixed',len(fixed))
              else: print(TGT,'clean')
          open('bridge/guard/last-sweep.json','w') if False else None
          os.chdir('/tmp/pgf') if False else None
          # 巡毕落戳(借末仓树)
          try:
              import urllib.request as _u, base64 as _b
              _body=json.dumps({'ts':ts},ensure_ascii=False).encode()
              _rq=_u.Request('https://api.github.com/repos/chepin-ai/vci-inbox/contents/bridge/guard/last-sweep.json',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              _cur={}
              try: _cur=json.loads(_u.urlopen(_rq,timeout=15).read().decode())
              except Exception: pass
              _put={'message':'pub-guard-full sweep stamp [skip ci]','content':_b.b64encode(_body).decode()}
              if 'sha' in _cur: _put['sha']=_cur['sha']
              _rq2=_u.Request('https://api.github.com/repos/chepin-ai/vci-inbox/contents/bridge/guard/last-sweep.json',method='PUT',data=json.dumps(_put).encode(),headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              print('stamp',_u.urlopen(_rq2,timeout=20).status)
          except Exception as _e: print('stamp fail',_e)
          PYEOF