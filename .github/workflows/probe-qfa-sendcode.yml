name: probe-qfa-sendcode
on: [workflow_dispatch]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - env:
          QI_PAT: ${{ secrets.QI_FULL_PAT }}
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request,urllib.error
          def api(m,u):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+os.environ['QI_PAT'],'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); return x.status,json.loads(x.read().decode())
              except urllib.error.HTTPError as e: return e.code,{}
          T='https://api.github.com/repos/chepin-qi/qfa-quantum-lab'
          s,iss=api('GET',T+'/issues?state=all&per_page=3')
          for i in (iss or [])[:3]: print('issue#%s'%i['number'],i['title'][:40],i['state'])
          s,runs=api('GET',T+'/actions/workflows/otp-issue-trigger.yml/runs?per_page=2')
          for r in runs.get('workflow_runs',[])[:2]: print('otp-run',r['conclusion'] or r['status'],r['created_at'])
          s,cm=api('GET',T+'/issues/1/comments')
          for c in (cm or [])[-1:]: print('回执:',c['body'][:150])
          PYEOF
