name: cmd-purge
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: line IT删CMD_AUTH(line面;值永不打印;用后即焚)
        env:
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,urllib.request
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['LINE_ID']},os.environ['LINE_KEY'],algorithm='RS256')
          H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
          inst=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)))
          iid=inst[0]['id']
          rq=urllib.request.Request(f'https://api.github.com/app/installations/{iid}/access_tokens',method='POST',headers=H); rq.data=b'{}'
          IT=json.load(urllib.request.urlopen(rq))['token']
          B='https://api.github.com/repos/chepin-ai'
          out={}
          for rp in ['vci-usrm','qlv-lab','vci-cfts','vci-qgl','vci-ucif2','vci-vinf','github-repo-cfts','quantum-go-ledger','ucif2-formalization-kernel','usrm-repo','vinf-market-kernel']:
              u=f'{B}/{rp}/actions/secrets/CMD_AUTH'
              r=urllib.request.Request(u,method='DELETE',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); out[rp]=x.status
              except Exception as e: out[rp]=getattr(e,'code',0)
          print(json.dumps(out))
          PYEOF
