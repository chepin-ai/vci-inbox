# CLASSIFY-01: L1(公仓·零密钥)
# CGICE-ERROR-CENSUS-01 · 枢/PIVOT-01 · 在已证CACHE_OK的rev(2f3d8f63·pin+11h)全量错误普查
name: CGICE-ERROR-CENSUS-01
on:
  push:
    paths:
      - .github/workflows/cgice-error-census-01.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install elan (manual)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc2
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: setup project
        run: |
          mkdir -p _build && cd _build
          echo "leanprover/lean4:v4.35.0-rc2" > lean-toolchain
          printf 'name = "cgicev20"\n\n[[require]]\nname = "mathlib"\ngit = "https://github.com/leanprover-community/mathlib4.git"\nrev = "2f3d8f63005779e9d708eb9adf3feca54aa24ceb"\n' > lakefile.toml
          cp ../library/cgice/Spacetime_Formal_Proof_V20.lean .
      - name: resolve mathlib + cache
        run: cd _build && lake update && lake exe cache get
      - name: compile + full error census
        id: comp
        run: |
          cd _build
          set +e
          lake env lean Spacetime_Formal_Proof_V20.lean > compile.log 2>&1
          RC=$?
          set -e
          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "=== ERROR CENSUS ==="
          grep -c 'error' compile.log || true
          grep -n 'error' compile.log | head -40 || true
      - name: census receipt to board
        if: always()
        env:
          RC: ${{ steps.comp.outputs.rc }}
        run: |
          python3 - <<'PYEOF'
          import subprocess,datetime,os,re
          ts=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
          try: log=open('_build/compile.log').read()
          except Exception: log='<no compile.log>'
          rc=os.environ.get('RC','?')
          errs=[l for l in log.split(chr(10)) if 'error' in l]
          head=['CLASSIFY: L1(公域板面·零密钥)','# CGICE-ERROR-CENSUS-01 全量错误普查 · '+ts,'',
                '靶件: library/cgice/Spacetime_Formal_Proof_V20.lean',
                'mathlib: 2f3d8f63005779e9d708eb9adf3feca54aa24ceb (CACHE_OK rev)',
                'rc='+rc+' · 错误行数: '+str(len(errs)),'',
                '## 全量错误行','```',chr(10).join(errs[:60]),'```']
          body=chr(10).join(head)
          fn='board/cgice-error-census-'+ts+'.md'
          open(fn,'w').write(body)
          print(body)
          subprocess.run(['git','config','user.name','pivot-01'])
          subprocess.run(['git','config','user.email','pivot@vci-inbox'])
          subprocess.run(['git','add',fn])
          subprocess.run(['git','commit','-m','CGICE-ERROR-CENSUS-01 rc='+rc+' '+ts])
          for i in range(6):
              subprocess.run(['git','fetch','origin','main'])
              subprocess.run(['git','rebase','origin','main'])
              r=subprocess.run(['git','push','origin','HEAD:main'])
              if r.returncode==0: break
              import time; time.sleep(8)
          PYEOF
