name: line-fetch
on:
  workflow_dispatch:
    inputs:
      target_repo: {description: '目标仓(line覆盖)', required: true}
      target_path: {description: '目标路径(文件或目录)', required: true}
      sink_repo: {description: '落证仓(hub覆盖)', required: true, default: 'ci-control'}
      sink_path: {description: '落证路径前缀', required: true, default: 'bridge/line-fetch'}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: line-fetch (line读目标→hub落证,内容禁打印)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
          TGT_R: ${{ inputs.target_repo }}
          TGT_P: ${{ inputs.target_path }}
          SINK_R: ${{ inputs.sink_repo }}
          SINK_P: ${{ inputs.sink_path }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,urllib.request,urllib.error,urllib.parse,base64,hashlib
          def it_of(k,i,inst):
              now=int(time.time())
              t=jwt.encode({'iat':now-90,'exp':now+540,'iss':i},k,algorithm='RS256')
              r=urllib.request.Request(f'https://api.github.com/app/installations/{inst}/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'line-fetch'})
              return json.load(urllib.request.urlopen(r))['token']
          HUB=it_of(os.environ['HUB_KEY'],os.environ['HUB_ID'],'154355791')
          LINE=it_of(os.environ['LINE_KEY'],os.environ['LINE_ID'],'155768871')
          B='https://api.github.com/repos/chepin-ai'
          def gh(tok,m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+tok,'Accept':'application/vnd.github+json','User-Agent':'line-fetch'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:150]
          def putc_hub(repo,path,text,msg):
              s,old=gh(HUB,'GET',f'{B}/{repo}/contents/{urllib.parse.quote(path)}')
              d={'message':msg,'content':base64.b64encode(text.encode()).decode()}
              if s==200: d['sha']=old['sha']
              return gh(HUB,'PUT',f'{B}/{repo}/contents/{urllib.parse.quote(path)}',d)[0]
          tgt=os.environ['TGT_R']; tp=os.environ['TGT_P']
          s,node=gh(LINE,'GET',f'{B}/{tgt}/contents/{urllib.parse.quote(tp)}')
          if s!=200: raise SystemExit(f'FETCH FAIL {s}: {node}')
          ts=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
          manifest=[]
          if isinstance(node,list):
              for it in node:
                  if it['type']!='file': continue
                  s2,f=gh(LINE,'GET',it['url'])
                  if s2!=200: continue
                  raw=base64.b64decode(f['content']).decode('utf-8','ignore')
                  sp=f"{os.environ['SINK_P']}/{tgt}/{it['name']}"
                  st=putc_hub(os.environ['SINK_R'],sp,raw,f'line-fetch {tgt}/{it["name"]}')
                  manifest.append({'src':it['path'],'sink':sp,'status':st,'sha256':hashlib.sha256(raw.encode()).hexdigest()[:16],'bytes':len(raw)})
          else:
              raw=base64.b64decode(node['content']).decode('utf-8','ignore')
              sp=f"{os.environ['SINK_P']}/{tgt}/{os.path.basename(tp)}"
              st=putc_hub(os.environ['SINK_R'],sp,raw,f'line-fetch {tgt}/{tp}')
              manifest.append({'src':tp,'sink':sp,'status':st,'sha256':hashlib.sha256(raw.encode()).hexdigest()[:16],'bytes':len(raw)})
          st=putc_hub(os.environ['SINK_R'],f"{os.environ['SINK_P']}/manifest-{tgt}-{ts}.json",json.dumps(manifest,ensure_ascii=False,indent=2),'line-fetch manifest')
          print(json.dumps({'files':len(manifest),'manifest_status':st},ensure_ascii=False))
          if any(m['status'] not in (200,201) for m in manifest): raise SystemExit('SINK FAIL')
          PYEOF
