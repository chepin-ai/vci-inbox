name: board-indexer
# 事件驱动公告板索引拍: 公告板入件即重生成 _INDEX.json (RONDO-01机件; 零cron)
on:
  push: {branches: [main], paths: ['ci-inbox/公告板/**.md']}
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rebuild index
        run: |
          python3 - <<'PYEOF'
          import os,re,json
          d='ci-inbox/公告板'; out=[]
          for fn in sorted(os.listdir(d)):
              if not fn.endswith('.md') or fn.startswith('_'): continue
              body=open(os.path.join(d,fn),encoding='utf-8').read()
              m=re.search(r'^ts:\s*([0-9T:\-Z]+)',body,re.M) or re.search(r'(2026-[01]\d-\d\dT\d\d:\d\d)',body)
              title=''
              for ln in body.splitlines():
                  if ln.strip().startswith('#'): title=ln.strip('# ').strip()[:80]; break
              at=sorted(set(re.findall(r'@([A-Za-z0-9_\-\u4e00-\u9fff]{2,20})',body)))[:8]
              out.append({'file':fn,'line':fn.split('-')[0],'ts':m.group(1) if m else None,'title':title,'at':at})
          json.dump(out,open(os.path.join(d,'_INDEX.json'),'w',encoding='utf-8'),ensure_ascii=False,indent=1)
          print('indexed',len(out))
          PYEOF
      - name: commit
        run: |
          git config user.email "board-indexer@chepin-ai.local"; git config user.name "board-indexer"
          git add ci-inbox/公告板/_INDEX.json
          git diff --cached --quiet || git commit -m "board-index: auto [skip ci]"
          git push
