name: field-router
on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 */2 * * *'
permissions:
  contents: write
  # rationale: commits router-state + ledger pointers to this repo (public, hashes only)
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 直通场绑定转发圈 (qfa收割/密封转运/DM/链哈希台账; 件本体只落私仓)
        env:
          GT: ${{ secrets.GITEE_MIRROR_PAT }}
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ secrets.CI_OPS_HUB_ID }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF'
          import os,json,urllib.request,base64,datetime,hashlib,urllib.error
          GT=os.environ['GT']; HK=os.environ['HUBK']; HID=os.environ['HUBID']
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          def gj(m,u,d=None,tok=None):
              h={'User-Agent':'field-router'}
              if tok: h['Authorization']='token '+tok
              r=urllib.request.Request(u,method=m,headers=h)
              if d is not None: r.data=json.dumps(d).encode(); r.add_header('Content-Type','application/json')
              try:
                  x=urllib.request.urlopen(r,timeout=25); return x.status,x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code,(e.read().decode()[:300] if e.fp else '')
              except Exception as e: return 0,str(e)[:200]
          # hub IT
          import jwt as JW
          now=int(datetime.datetime.now().timestamp())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':HID},HK,algorithm='RS256')
          s,r=gj('POST','https://api.github.com/app/installations/154355791/access_tokens',tok=None,d=None) if False else (None,None)
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'field-router'})
          HIT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          def gh(m,u,d=None):
              h={'Authorization':'token '+HIT,'Accept':'application/vnd.github+json','User-Agent':'field-router'}
              r=urllib.request.Request(u,method=m,headers=h)
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r,timeout=25); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:300]
          def gget(path):
              s,r=gh('GET','https://api.github.com/repos/chepin-ai/ci-control/contents/'+urllib.parse.quote(path))
              return (s,base64.b64decode(r['content']).decode() if s==200 else None)
          def gput(repo,path,content,msg):
              s,old=gh('GET','https://api.github.com/repos/chepin-ai/'+repo+'/contents/'+urllib.parse.quote(path))
              body={'message':msg,'content':base64.b64encode(content.encode()).decode()}
              if s==200 and isinstance(old,dict): body['sha']=old['sha']
              return gh('PUT','https://api.github.com/repos/chepin-ai/'+repo+'/contents/'+urllib.parse.quote(path),body)[0]
          import urllib.parse
          log={'ts':ts,'harvest':[],'sealed':[],'dm':None,'escalations':[],'ledger':[]}
          # ---- stream-ledger (chain-hash) ----
          ls,lc=gget('bridge/stream-ledger.jsonl')
          lines=[l for l in (lc or '').split(chr(10)) if l.strip()]
          prev=json.loads(lines[-1])['hash'] if lines else 'STREAM-GENESIS-20260828'
          def led(action,detail):
              global prev
              e={'ts':ts,'seq':len(lines)+len(log['ledger'])+1,'action':action,'detail':detail,'prev':prev}
              e['hash']=hashlib.sha256((prev+json.dumps({k:v for k,v in e.items() if k!='hash'},sort_keys=True,ensure_ascii=False,separators=(',',':'))).encode()).hexdigest()
              prev=e['hash']; log['ledger'].append(e)
          # ---- gitee helpers ----
          def gg(m,u,d=None):
              return gj(m,u,d,tok=GT)
          s,ri=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line')
          dbr='master'
          if s==200:
              try: dbr=json.loads(ri).get('default_branch','master')
              except Exception: pass
          # ---- 1) harvest qfa outbox ----
          s,c=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/outbox/qfa-outbox.json')
          if s==200:
              raw=base64.b64decode(json.loads(c)['content']).decode()
              try: items=json.loads(raw).get('items',[])
              except Exception: items=[]
              ss,sc=gget('bridge/intake/qfa/harvested.json')
              done=json.loads(sc)['ids'] if sc else []
              for it in items:
                  iid=it.get('id')
                  if iid and iid not in done:
                      st2=gput('ci-control','bridge/intake/qfa/'+iid+'.json',json.dumps(it,ensure_ascii=False,indent=1),'field-router: harvest '+iid)
                      done.append(iid)
                      log['harvest'].append({'id':iid,'sha256':hashlib.sha256(json.dumps(it,ensure_ascii=False,sort_keys=True).encode()).hexdigest()[:16],'sink':st2})
                      led('harvest.qfa',{'id':iid,'sink_status':st2})
                      body=str(it.get('body',''))+str(it.get('payload',''))
                      if any(w in body for w in ['PAT','_KEY','TOKEN','SECRET','私钥','口令']):
                          gput('ci-control','inbox/ESCALATION-'+iid+'.md','# 升级件 '+iid+chr(10)+'凭证类标记,按律升级cisvr/root,不自动转发。'+chr(10),'field-router: escalation '+iid)
                          log['escalations'].append(iid); led('escalate',{'id':iid})
              gput('ci-control','bridge/intake/qfa/harvested.json',json.dumps({'ts':ts,'ids':done},ensure_ascii=False,indent=1),'field-router: harvest cursor '+str(len(done)))
              # public receipt (hashes only, R1-safe) to gitee bridge
              rec={'ts':ts,'harvested_total':len(done),'new':[h['id'] for h in log['harvest']],'hashes':{h['id']:h['sha256'] for h in log['harvest']}}
              rc=json.dumps(rec,ensure_ascii=False,indent=1)
              s3,old3=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/bridge/HARVEST-RECEIPT.json')
              b3={'message':'field-router harvest receipt','content':base64.b64encode(rc.encode()).decode()}
              if s3==200: b3['sha']=json.loads(old3)['sha']
              rcode='PUT' if s3==200 else 'POST'
              st4,_=gg(rcode,'https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/bridge/HARVEST-RECEIPT.json',b3)
              log['receipt_push']=st4; led('receipt.gitee',{'status':st4,'new':len(log['harvest'])})
          # ---- 2) sealed transit ----
          s,sl=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/sealed')
          if s==200:
              for f in json.loads(sl):
                  nm=f.get('name','')
                  if not nm or nm.startswith('.'): continue
                  ss,exist=gget('bridge/sealed-inbox/'+nm+'.b64')
                  if exist: continue
                  s5,fc=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/sealed/'+urllib.parse.quote(nm))
                  if s5==200:
                      gput('ci-control','bridge/sealed-inbox/'+nm+'.b64',json.loads(fc)['content'].replace(chr(10),''),'field-router: sealed transit '+nm)
                      log['sealed'].append(nm); led('sealed.transit',{'name':nm})
          # ---- 3) dm-queue pong ----
          s,dq=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/dm-queue/qfa/line.json')
          if s==200:
              dj=json.loads(base64.b64decode(json.loads(dq)['content']).decode())
              if dj.get('status','').startswith('open'):
                  anch=urllib.request.urlopen('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/beacon-anchor.json',timeout=15).read().decode()
                  dj['status']='active'; dj['pong_ts']=ts; dj['pong_from']='cisvr-field-router'; dj['anchor']=json.loads(anch)
                  body={'message':'DM pong: line active','content':base64.b64encode(json.dumps(dj,ensure_ascii=False,indent=1).encode()).decode(),'sha':json.loads(dq)['sha']}
                  st6,_=gg('PUT','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/dm-queue/qfa/line.json',body)
                  log['dm']={'pong':st6}; led('dm.pong',{'status':st6})
              else:
                  log['dm']={'status':dj.get('status')}
          # ---- 4) bridge-state update + ledger commit ----
          ss,bs=gget('bridge/qfa/bridge-state.json')  # placeholder ci-control side
          bsj={'ts':ts,'qfa_items_seen':len(done) if s==200 else None,'last_run':ts}
          newledger=(lc or '')+('' if not lc or lc.endswith(chr(10)) else chr(10))+chr(10).join(json.dumps(e,ensure_ascii=False) for e in log['ledger'])+chr(10)
          gput('ci-control','bridge/stream-ledger.jsonl',newledger,'field-router: stream-ledger +'+str(len(log['ledger'])))
          gput('vci-inbox','bridge/qfa/router-state.json',json.dumps({'ts':ts,'new_harvested':len(log['harvest']),'sealed_new':len(log['sealed']),'dm':log['dm'],'ledger_head':prev[:16]},ensure_ascii=False,indent=1),'field-router state [skip ci]')
          print(json.dumps({'harvest':len(log['harvest']),'sealed':len(log['sealed']),'dm':log['dm'],'esc':log['escalations'],'head':prev[:16]},ensure_ascii=False))

          PYEOF
