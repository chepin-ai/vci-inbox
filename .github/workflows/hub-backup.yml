name: hub-backup
on:
  workflow_run:
    workflows: [kernel-loop]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "hub三仓快照 v4: git面重写(排除自吞·分仓隔离·铸钥即焚)"
        env:
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          set -e
          python3 -m pip install -q pyjwt
          IT=$(python3 - <<'PYEOF'
          import os,time,json,urllib.request,jwt as JW
          now=int(time.time())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUBID']},os.environ['HUBK'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'hub-backup-v4'})
          print(json.loads(urllib.request.urlopen(rq,timeout=20).read())['token'])
          PYEOF
          )
          # 名值分离: token仅env/extraheader, 永不入URL argv (毂错#12)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(echo -n x:$IT | base64 -w0)"
          unset IT
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          GH_TOKEN_V=$(python3 - <<'PYT'
          import os,time,json,urllib.request,jwt as JW
          now=int(time.time())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUBID']},os.environ['HUBK'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json'})
          print(json.loads(urllib.request.urlopen(rq,timeout=20).read())['token'])
          PYT
          )
          # 20h节流
          if [ -f stamp.json ]; then :; fi
          git clone -q --depth 1 https://github.com/chepin-ai/vci-inbox.git wb 2>/dev/null || true
          if [ -f wb/bridge/guard/hub-backup-stamp.json ]; then
            LAST=$(python3 -c "import json;print(json.load(open('wb/bridge/guard/hub-backup-stamp.json'))['ts'])" 2>/dev/null || echo "")
            if [ -n "$LAST" ]; then
              AGE=$(( $(date -u +%s) - $(date -u -d "${LAST:0:8} ${LAST:9:2}:${LAST:11:2}:${LAST:13:2}" +%s 2>/dev/null || echo 0) ))
              if [ "$AGE" -lt 72000 ] && [ "$AGE" -gt 0 ]; then echo "throttle age=${AGE}s skip"; exit 0; fi
            fi
          fi
          git clone -q --depth 1 https://github.com/chepin-ai/ci-inbox.git dst
          mkdir -p dst/archive/hub-backup
          DONE=""
          for REPO in ci-control vci-inbox ci-inbox; do
            echo "== $REPO =="
            git clone -q --depth 1 https://github.com/chepin-ai/$REPO.git src-$REPO
            tar -czf /tmp/$REPO.tgz --exclude=.git --exclude='archive/hub-backup' -C src-$REPO .
            SZ=$(stat -c%s /tmp/$REPO.tgz)
            base64 -w0 /tmp/$REPO.tgz > /tmp/$REPO.b64
            split -b 48m -d /tmp/$REPO.b64 dst/archive/hub-backup/$REPO-$TS.tar.gz.b64.part
            rm -f /tmp/$REPO.b64
            echo "$REPO tar=${SZ}B (自吞排除后)"
            DONE="$DONE $REPO:${SZ}B"
            rm -rf src-$REPO /tmp/$REPO.tgz
            # 滚动7
            for OLDTS in $(ls dst/archive/hub-backup/ | grep -o "^$REPO-[0-9T]*Z" | sort -u | head -n -7); do git -C dst rm -q "archive/hub-backup/$OLDTS"* 2>/dev/null || true; done
          done
          git -C dst config user.name "hub-backup"; git -C dst config user.email "hub-backup@users.noreply.github.com"
          git -C dst add archive/hub-backup/
          git -C dst commit -q -m "hub-backup v4 $TS:$DONE [skip ci]"
          PUSHOK=0
          for i in 1 2 3 4 5 6; do git -C dst pull --rebase -q origin main && git -C dst push origin HEAD:main > /tmp/dstpush.log 2>&1 && PUSHOK=1 && break; sleep 5; done
          echo "dst push verdict=$PUSHOK"; tail -c 400 /tmp/dstpush.log || true
          mkdir -p wb/bridge/guard
          { echo "dst_push_ok=$PUSHOK"; tail -c 400 /tmp/dstpush.log; } > wb/bridge/guard/hub-backup-dstpush-diag.txt
          python3 - <<'PYEOF2'
          import os,json,base64,urllib.request,urllib.error,time
          import jwt as JW
          now=int(time.time())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUBID']},os.environ['HUBK'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json'})
          IT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          body=json.dumps({'message':'hub-backup REST write probe','content':base64.b64encode(b'probe').decode()}).encode()
          req=urllib.request.Request('https://api.github.com/repos/chepin-ai/ci-inbox/contents/archive/hub-backup/REST-PROBE.md',data=body,method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try:
              resp=urllib.request.urlopen(req,timeout=30); print('REST write ci-inbox:',resp.status)
          except urllib.error.HTTPError as e: print('REST write ci-inbox FAIL:',e.code,e.read().decode()[:200])
          PYEOF2
          # 落面验证闸: 远端无新分块即整run红(毂错#5 推送成功≠落面成功)
          for i in 1 2 3 4 5 6; do git -C dst pull --rebase -q origin main && git -C dst push -q origin HEAD:main && break; sleep 5; done
          python3 - <<'PYV'
          import json,urllib.request,os,time
          ts=os.environ.get('TS') or ''
          PYV
          FIRST=$(ls dst/archive/hub-backup/ | grep "^ci-control-$TS" | head -1)
          echo "verify remote: $FIRST"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN_V" https://api.github.com/repos/chepin-ai/ci-inbox/contents/archive/hub-backup/$FIRST || echo 000)
            [ "$CODE" = "200" ] && echo "落面验证绿" && break
            [ "$i" = "6" ] && [ "$CODE" != "200" ] && echo "落面验证红(http=$CODE)" && exit 1
            sleep 5
          done
          # stamp(写vci-inbox经REST免再克隆)
          python3 - <<PYEOF
          import json,base64,os,urllib.request
          ts="$TS"; done="$DONE".strip()
          tok=os.environ.get('GIT_CONFIG_VALUE_0','')
          hdr={'Authorization':'Bearer '+os.environ['HUBK'],'Accept':'application/vnd.github+json'}
          # stamp经dst同仓体系外, 用wb仓git写
          PYEOF
          echo "{"ts":"$TS","done":"$DONE"}" > wb/bridge/guard/hub-backup-stamp.json
          git -C wb config user.name "hub-backup"; git -C wb config user.email "hub-backup@users.noreply.github.com"
          git -C wb add bridge/guard/hub-backup-stamp.json bridge/guard/hub-backup-dstpush-diag.txt || git -C wb add bridge/guard/hub-backup-stamp.json
          git -C wb commit -q -m "hub-backup stamp $TS [skip ci]"
          for i in 1 2 3 4 5 6; do git -C wb pull --rebase -q origin main && git -C wb push -q origin HEAD:main && break; sleep 5; done
          echo "DONE $TS:$DONE"
