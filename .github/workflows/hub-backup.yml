name: hub-backup
on:
  workflow_run:
    workflows: [kernel-loop]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: "DIAG v3 分段探针(零密钥值·微负载)"
        env:
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF'
          import os,json,time,datetime,urllib.request,urllib.error,base64
          import jwt as JW
          OWNER='chepin-ai'; GH='https://api.github.com'
          D={'stages':{}}
          now=int(time.time())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUBID']},os.environ['HUBK'],algorithm='RS256')
          rq=urllib.request.Request(GH+'/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'hub-backup-diag'})
          IT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          H={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','User-Agent':'hub-backup-diag'}
          def call(stage,req):
              try:
                  r=urllib.request.urlopen(req,timeout=90); b=r.read()
                  D['stages'][stage]={'ok':True,'bytes':len(b)}
                  return b
              except urllib.error.HTTPError as e:
                  D['stages'][stage]={'ok':False,'http':e.code,'err':e.read().decode()[:300]}; return None
              except Exception as e:
                  D['stages'][stage]={'ok':False,'err':str(e)[:200]}; return None
          # S1 codeload×3
          for repo in ['ci-control','vci-inbox','ci-inbox']:
              call('codeload:'+repo, urllib.request.Request('https://codeload.github.com/'+OWNER+'/'+repo+'/tar.gz/refs/heads/main',headers=H))
          # S2 graphql head
          q='query($n:String!){repository(owner:"'+OWNER+'",name:$n){ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          hb=call('gql:head:ci-inbox', urllib.request.Request(GH+'/graphql',data=json.dumps({'query':q,'variables':{'n':'ci-inbox'}}).encode(),method='POST',headers=H))
          # S3 graphql 微负载试写(vci-inbox)
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          if hb:
              oid=json.loads(hb)['data']['repository']['ref']['target']['oid']
              mut='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}'
              # 注意: 试写落vci-inbox需另取head
              q2='query{repository(owner:"'+OWNER+'",name:"vci-inbox"){ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
              hb2=call('gql:head:vci-inbox', urllib.request.Request(GH+'/graphql',data=json.dumps({'query':q2}).encode(),method='POST',headers=H))
              if hb2:
                  oid2=json.loads(hb2)['data']['repository']['ref']['target']['oid']
                  inp={'branch':{'repositoryNameWithOwner':OWNER+'/vci-inbox','branchName':'main'},'message':{'headline':'hub-backup DIAG-GQL '+ts},'expectedHeadOid':oid2,'fileChanges':{'additions':[{'path':'archive/hub-backup/DIAG-GQL-'+ts+'.json','contents':base64.b64encode(b'{"probe":true}').decode()}]}}
                  call('gql:commit:micro', urllib.request.Request(GH+'/graphql',data=json.dumps({'query':mut,'variables':{'input':inp}}).encode(),method='POST',headers=H))
          # DIAG回执 REST PUT(kit已证通道)
          body=json.dumps({'ts':ts,**D},ensure_ascii=False).encode()
          put=urllib.request.Request(GH+'/repos/'+OWNER+'/vci-inbox/contents/archive/hub-backup/DIAG3-'+ts+'.json',data=json.dumps({'message':'hub-backup DIAG3 '+ts,'content':base64.b64encode(body).decode()}).encode(),method='PUT',headers={**H,'Content-Type':'application/json'})
          call('diag:put', put)
          print(json.dumps(D,ensure_ascii=False)[:800])
          PYEOF