name: relay-otp-qfa
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: OTP-RELAY-QFA-01 (vci-qgl vars→qfa vars;内存中继零打印零落盘)
        env:
          AI_PAT: ${{ secrets.AI_FULL_PAT }}
          QI_PAT: ${{ secrets.QI_FULL_PAT }}
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request,urllib.error
          def mk(t):
              def api(m,u,d=None):
                  r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+t,'Accept':'application/vnd.github+json','User-Agent':'otp-relay'})
                  if d is not None: r.data=json.dumps(d).encode()
                  try:
                      x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
                  except urllib.error.HTTPError as e: return e.code,{}
              return api
          ai=mk(os.environ['AI_PAT']); qi=mk(os.environ['QI_PAT'])
          SRC='https://api.github.com/repos/chepin-ai/qlv-lib/actions/variables/'
          DST='https://api.github.com/repos/chepin-qi/qfa-quantum-lab/actions/variables'
          for name in ('OTP_PHONE','OTP_EMAIL1','OTP_EMAIL2'):
              s,v=ai('GET',SRC+name)
              if s!=200: print(name,'src-read FAIL',s); continue
              val=v['value']  # 内存only
              s2,r2=qi('POST',DST,{'name':name,'value':val})
              if s2==422 or s2==409: s2,r2=qi('PATCH',DST+'/'+name,{'name':name,'value':val})
              val=None
              s3,chk=qi('GET',DST+'/'+name)
              print(name,'write',s2,'verify',s3, 'masked' if s3==200 else '')
          PYEOF
