name: secret-channel-smoke
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate named secrets without printing values
        env:
          PAT: ${{ secrets.AI_FULL_PAT }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          DEEPSEEK_API_KEY_VCI1: ${{ secrets.DEEPSEEK_API_KEY_VCI1 }}
          KIMI_API_KEY_VCI1: ${{ secrets.KIMI_API_KEY_VCI1 }}
        run: |
          python3 - <<'PYE'
          import json,os,urllib.request
          names=['PAT','KAGGLE_KEY','KAGGLE_USERNAME','DEEPSEEK_API_KEY_VCI1','KIMI_API_KEY_VCI1']
          presence={name:bool(os.environ.get(name)) for name in names}
          print(json.dumps({'secret_presence':presence}))
          if not all(presence.values()): raise SystemExit(1)
          req=urllib.request.Request('https://api.github.com/user',headers={'Authorization':'Bearer '+os.environ['PAT'],'Accept':'application/vnd.github+json','User-Agent':'secret-channel-smoke'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          print(json.dumps({'pat_authenticated':True,'login':data.get('login')}))
          PYE
