name: audit-ring
on:
  workflow_dispatch: {}
  schedule:
    - cron: '7 3 * * *'
permissions:
  contents: write
  # rationale: no self-repo writes; reports land in private ci-control via hub App
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: "治理机日审: 三账对平/信标连续/面可达/期待超时"
        env:
          GT: ${{ secrets.GITEE_MIRROR_PAT }}
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF'
          import os,json,urllib.request,urllib.error,urllib.parse,base64,datetime,hashlib
          GT=os.environ['GT']; HK=os.environ['HUBK']; HID=os.environ['HUBID']
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          day=ts[:10]
          import jwt as JW
          now=int(datetime.datetime.now().timestamp())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':HID},HK,algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'audit-ring'})
          HIT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          def gh(m,u,d=None):
              h={'Authorization':'token '+HIT,'Accept':'application/vnd.github+json','User-Agent':'audit-ring'}
              r=urllib.request.Request(u,method=m,headers=h)
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r,timeout=25); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,None
          def gget(repo,path):
              s,r=gh('GET','https://api.github.com/repos/chepin-ai/'+repo+'/contents/'+urllib.parse.quote(path))
              return base64.b64decode(r['content']).decode() if s==200 else None
          def gput(repo,path,content,msg):
              s,old=gh('GET','https://api.github.com/repos/chepin-ai/'+repo+'/contents/'+urllib.parse.quote(path))
              body={'message':msg,'content':base64.b64encode(content.encode()).decode()}
              if s==200 and isinstance(old,dict): body['sha']=old['sha']
              return gh('PUT','https://api.github.com/repos/chepin-ai/'+repo+'/contents/'+urllib.parse.quote(path),body)[0]
          def gg(u):
              r=urllib.request.Request(u,headers={'User-Agent':'audit-ring','Authorization':'token '+GT})
              try: return urllib.request.urlopen(r,timeout=25).status,urllib.request.urlopen(r,timeout=25).read().decode()
              except Exception as e: return getattr(e,'code',0),None
          def rawg(u):
              try:
                  r=urllib.request.Request(u,headers={'User-Agent':'audit-ring'})
                  return 200,urllib.request.urlopen(r,timeout=20).read().decode()
              except Exception: return 0,None
          A={'ts':ts,'checks':[],'mismatches':[]}
          def chk(name,ok,detail):
              A['checks'].append({'name':name,'ok':bool(ok),'detail':detail})
              if not ok: A['mismatches'].append({'name':name,'detail':detail})
          # 1) beacon continuity: anchor == BEACON.hash, seq equal
          b1=rawg('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/beacon-anchor.json')
          b2=gget('ci-control','bridge/beacon/BEACON.json')
          try:
              a1=json.loads(b1[1]); a2=json.loads(b2)
              chk('beacon.anchor_eq', a1.get('sha256')==a2.get('hash') and a1.get('seq')==a2.get('seq'), {'anchor_seq':a1.get('seq'),'beacon_seq':a2.get('seq')})
          except Exception as e: chk('beacon.anchor_eq',False,str(e)[:80])
          # 2) qfa three-ledger: gitee tail vs intake cursor vs receipt
          s,c=gg('https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/outbox/qfa-outbox.json')
          hv=gget('ci-control','bridge/intake/qfa/harvested.json')
          try:
              items=json.loads(base64.b64decode(json.loads(c)['content']).decode()).get('items',[])
              done=json.loads(hv)['ids']
              missing=[i.get('id') or '(noid)' for i in items if i.get('id') not in done]
              chk('qfa.3ledger', not missing, {'gitee_items':len(items),'intake':len(done),'missing':missing})
          except Exception as e: chk('qfa.3ledger',False,str(e)[:80])
          # 3) qlv-pub face vs intake cursor
          s,lst=rawg('https://api.github.com/repos/chepin-qi/qlv-pub/git/trees/main?recursive=1')
          hv2=gget('ci-control','bridge/intake/qlv/harvested.json')
          try:
              tree=[t['path'] for t in json.loads(lst).get('tree',[]) if t.get('type')=='blob' and (t['path'].endswith('.json') or t['path'].endswith('.md'))]
              done2=json.loads(hv2)['ids'] if hv2 else []
              miss2=[p for p in tree if p not in done2]
              chk('qlv.3ledger', not miss2, {'face_files':len(tree),'intake':len(done2),'missing':miss2})
          except Exception as e: chk('qlv.3ledger',False,str(e)[:80])
          # 4) usrm narrative head vs line-sense cursor
          nar=gget('vci-usrm','ure/narrative_outbox.json')
          cur=gget('vci-inbox','lines/cursors.json')
          try:
              head=json.loads(nar)['entries'][-1]['seq']
              curs=json.loads(cur) if cur else {}
              chk('usrm.narrative_cursor', True, {'head':head,'cursor':curs.get('usrm_narrative','n/a')})
          except Exception as e: chk('usrm.narrative_cursor',False,str(e)[:80])
          # 5) faces reachability (FACES-REG class A)
          fr=gget('ci-control','bridge/FACES-REG-01.json')
          try:
              for f in json.loads(fr)['faces']:
                  if f.get('class')=='A' and f['face'].startswith('raw.githubusercontent'):
                      s,_=rawg('https://'+f['face']+'README.md')
                      chk('face.'+f['line'], s==200, {'face':f['face'][:60],'status':s})
          except Exception as e: chk('faces.reg',False,str(e)[:80])
          # 6) expectation overdue sweep
          er=gget('ci-control','bridge/EXPECT-REG-01.json')
          try:
              over=[i['id'] for i in json.loads(er)['items'] if i.get('state')=='watching' and i.get('deadline','') and not i['deadline'].startswith('open') and ts>i['deadline']]
              chk('expect.overdue', not over, {'overdue':over})
          except Exception as e: chk('expect.overdue',False,str(e)[:80])
          A['verdict']='CLEAN' if not A['mismatches'] else 'FINDINGS'
          st=gput('ci-control','bridge/audit/AUDIT-'+day+'.json',json.dumps(A,ensure_ascii=False,indent=1),'audit-ring daily '+day+' verdict='+A['verdict'])
          for m in A['mismatches']:
              gput('ci-control','bridge/findings/AUTO-AUDIT-'+day+'-'+m['name'].replace('.','_')+'.json',json.dumps({'id':'AUTO-AUDIT-'+day,'ts':ts,'class':'audit-mismatch','detail':m},ensure_ascii=False,indent=1),'audit-ring FINDING '+m['name'])
          print(json.dumps({'verdict':A['verdict'],'n_checks':len(A['checks']),'n_mismatch':len(A['mismatches'])},ensure_ascii=False))

          PYEOF
