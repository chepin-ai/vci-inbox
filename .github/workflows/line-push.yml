name: line-push
on:
  workflow_dispatch:
    inputs:
      target_repo: {description: '目标仓(line installation覆盖内)', required: true}
      target_path: {description: '目标路径', required: true}
      source_repo: {description: '源仓(hub覆盖)', required: true}
      source_path: {description: '源路径', required: true}
      msg: {description: 'commit说明', required: true}
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: line-push (hub读源→line写目标,allowlist动检)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
          TGT_R: ${{ inputs.target_repo }}
          TGT_P: ${{ inputs.target_path }}
          SRC_R: ${{ inputs.source_repo }}
          SRC_P: ${{ inputs.source_path }}
          MSG: ${{ inputs.msg }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,urllib.request,urllib.error,base64
          def it_of(k,i,inst):
              now=int(time.time())
              t=jwt.encode({'iat':now-90,'exp':now+540,'iss':i},k,algorithm='RS256')
              r=urllib.request.Request(f'https://api.github.com/app/installations/{inst}/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'line-push'})
              return json.load(urllib.request.urlopen(r))['token']
          HUB=it_of(os.environ['HUB_KEY'],os.environ['HUB_ID'],'154355791')
          LINE=it_of(os.environ['LINE_KEY'],os.environ['LINE_ID'],'155768871')
          B='https://api.github.com/repos/chepin-ai'
          def gh(tok,m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+tok,'Accept':'application/vnd.github+json','User-Agent':'line-push'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:150]
          # allowlist动检: 目标须在line installation覆盖内
          s,repos=gh(LINE,'GET','https://api.github.com/installation/repositories?per_page=100')
          allow={x['name'] for x in repos.get('repositories',[])}
          tgt=os.environ['TGT_R']
          if tgt not in allow: raise SystemExit(f'ABORT: {tgt} 不在line installation覆盖({sorted(allow)})')
          s,src=gh(HUB,'GET',f"{B}/{os.environ['SRC_R']}/contents/{os.environ['SRC_P']}")
          if s!=200: raise SystemExit(f'ABORT: 源读失败 {s}')
          body=base64.b64decode(src['content']).decode()
          s,old=gh(LINE,'GET',f"{B}/{tgt}/contents/{os.environ['TGT_P']}")
          payload={'message':os.environ['MSG'],'content':base64.b64encode(body.encode()).decode()}
          if s==200: payload['sha']=old['sha']
          s2,r2=gh(LINE,'PUT',f"{B}/{tgt}/contents/{os.environ['TGT_P']}",payload)
          print(json.dumps({'target':tgt,'path':os.environ['TGT_P'],'status':s2,'allow':sorted(allow)},ensure_ascii=False))
          if s2 not in (200,201): raise SystemExit(f'PUSH FAIL {s2}: {r2}')
          PYEOF
