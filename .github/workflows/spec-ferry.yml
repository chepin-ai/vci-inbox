name: spec-ferry
on:
  workflow_dispatch: {}
permissions:
  contents: write
  # rationale: commits ferry-latest.json (hashes only) to this public repo
jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "摆渡 七规范+OTP-kit+qi锚回执+DM pong → gitee qfa-line (私域)"
        env:
          GT: ${{ secrets.GITEE_MIRROR_PAT }}
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF'
          import os,json,urllib.request,urllib.error,urllib.parse,base64,datetime,hashlib
          GT=os.environ['GT']; HK=os.environ['HUBK']; HID=os.environ['HUBID']
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          import jwt as JW
          now=int(datetime.datetime.now().timestamp())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':HID},HK,algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'spec-ferry'})
          HIT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          def gh(m,u,d=None):
              h={'Authorization':'token '+HIT,'Accept':'application/vnd.github+json','User-Agent':'spec-ferry'}
              r=urllib.request.Request(u,method=m,headers=h)
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r,timeout=25); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:200]
          def gg(m,u,d=None):
              h={'User-Agent':'spec-ferry','Authorization':'token '+GT}
              r=urllib.request.Request(u,method=m,headers=h)
              if d is not None: r.data=json.dumps(d).encode(); r.add_header('Content-Type','application/json')
              try:
                  x=urllib.request.urlopen(r,timeout=25); return x.status,x.read().decode()
              except urllib.error.HTTPError as e: return e.code,(e.read().decode()[:200] if e.fp else '')
              except Exception as e: return 0,str(e)[:200]
          def ghread(repo,path):
              s,r=gh('GET','https://api.github.com/repos/chepin-ai/'+repo+'/contents/'+urllib.parse.quote(path))
              return base64.b64decode(r['content']).decode() if s==200 else None
          def gput(path,content,msg):
              u='https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/'+urllib.parse.quote(path)
              s,old=gg('GET',u)
              body={'message':msg,'content':base64.b64encode(content.encode()).decode()}
              if s==200:
                  o=json.loads(old)
                  if isinstance(o,dict) and 'sha' in o: body['sha']=o['sha']
              code='PUT' if (s==200 and 'sha' in body) else 'POST'
              st,resp=gg(code,u,body)
              return st
          result={'ts':ts,'ferried':{},'receipt':None,'dm':None}
          # ---- 1) seven specs ----
          specs={'RESONANCE-01.md':('ci-root','design/RESONANCE-01.md'),
           'SIG-ENVELOPE-01--SUBSTITUTE-ENVELOPE-FMT-01.md':('ci-root','bridge/ENVELOPE-FMT-01.md'),
           'SIG-ENVELOPE-01--SUBSTITUTE-QF-AUTH-01.md':('ci-root','design/QF-AUTH-01.md'),
           'FIELD-TIME-01-revised.md':('ci-root','design/FIELD-TIME-01.md'),
           'WAKE-01.md':('ci-root','design/WAKE-01.md'),
           'QROUTER-01.md':('ci-root','design/QROUTER-01.md'),
           'FAILOVER-SOLVE-01.md':('ci-root','design/FAILOVER-SOLVE-01.md'),
           'CODEC-FACE-02.md':('ci-root','design/CODEC-FACE-02.md')}
          for name,(repo,path) in specs.items():
              c=ghread(repo,path)
              if c:
                  st=gput('incoming/specs/'+name,c,'spec-ferry: '+name)
                  result['ferried'][name]={'st':st,'sha16':hashlib.sha256(c.encode()).hexdigest()[:16]}
              else:
                  result['ferried'][name]={'st':'SOURCE-404'}
          # ---- 2) OTP kit ----
          kit=['README.md','ROLLOUT.md','otp-loop-trigger.line.yml','otp_batch_drive.py','otp_qr_loop.py','scan_verify.py']
          for f in kit:
              c=ghread('ci-library','kit/otp-loop-01/'+f)
              if c:
                  st=gput('incoming/otp-loop-01/'+f,c,'spec-ferry: otp-kit '+f)
                  result['ferried']['otp-loop-01/'+f]={'st':st}
          # ---- 3) qi anchor receipt (e594ea4a) ----
          s,anchraw=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/outbox/qfa-outbox.json')
          tail=None
          if s==200:
              items=json.loads(base64.b64decode(json.loads(anchraw)['content']).decode()).get('items',[])
              tail=items[-1].get('id') if items else None
          receipt={'ts':ts,'anchor_received':'e594ea4a7f742da5','verdict':'REGISTERED',
           'note':'qi场首锚e594ea4a已收割入信封台账(GT-1测地线段-2检验点核销);锚构成=链尾⊗ai信标(seq32)交叉锚定,格式合规',
           'observed_tail':tail,'ledger':'stream-ledger(chain-hash,ci-control)'}
          st=gput('bridge/QI-ANCHOR-RECEIPT-e594ea4a.json',json.dumps(receipt,ensure_ascii=False,indent=1),'spec-ferry: qi anchor receipt')
          result['receipt']=st
          # ---- 4) DM line.json create/activate ----
          s,dq=gg('GET','https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/dm-queue/qfa/line.json')
          anch=json.loads(urllib.request.urlopen('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/beacon-anchor.json',timeout=15).read().decode())
          if s==200:
              o=json.loads(dq); dj=json.loads(base64.b64decode(o['content']).decode())
              dj['status']='active'; dj['pong_ts']=ts; dj['pong_from']='cisvr-spec-ferry'; dj['anchor']=anch
              st=gput('dm-queue/qfa/line.json',json.dumps(dj,ensure_ascii=False,indent=1),'DM pong: active')
          else:
              dj={'v':'dm-line/v1','line':'qfa','status':'active','opened_by':'qfa','pong_ts':ts,'pong_from':'cisvr-spec-ferry','anchor':anch,'note':'done_judge③: DM pong在案,专线active'}
              st=gput('dm-queue/qfa/line.json',json.dumps(dj,ensure_ascii=False,indent=1),'DM line init+pong: active')
          result['dm']=st
          # ---- 5) minimal public-safe state (hashes only) ----
          open('bridge/qfa/ferry-latest.json','w').write(json.dumps({'ts':ts,'n_ferried':len(result['ferried']),'sha16':{k:v.get('sha16') for k,v in result['ferried'].items()},'receipt':result['receipt'],'dm':result['dm']},ensure_ascii=False,indent=1))
          print(json.dumps({'ferried':len(result['ferried']),'fails':[k for k,v in result['ferried'].items() if v.get('st') not in (200,201)],'receipt':result['receipt'],'dm':result['dm']},ensure_ascii=False))

          PYEOF
      - name: commit ferry receipt
        run: |
          git config user.name spec-ferry; git config user.email ferry@local
          git add bridge/qfa/ferry-latest.json
          git commit -m "spec-ferry receipt [skip ci]" -q || echo noop
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 3; done
