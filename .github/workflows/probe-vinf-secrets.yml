name: probe-vinf-secrets（列vci-vinf secrets名+vars名,值不出runner）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列名
        env:
          TK: ${{ secrets.AI_FULL_PAT }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error
          H={'Authorization':'token '+os.environ['TK'],'Accept':'application/vnd.github+json'}
          rec={'probe':'VINF-SECRETS-01'}
          def gj(u):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30).read())
              except urllib.error.HTTPError as e: return {'err':e.code}
          rec['secrets']=[x['name'] for x in gj('https://api.github.com/repos/chepin-ai/vci-vinf/actions/secrets?per_page=50').get('secrets',[])] if 'err' not in str(gj('https://api.github.com/repos/chepin-ai/vci-vinf/actions/secrets?per_page=50')) else 'ERR'
          s=gj('https://api.github.com/repos/chepin-ai/vci-vinf/actions/secrets?per_page=50')
          rec['secrets']=[x['name'] for x in s.get('secrets',[])] if isinstance(s,dict) and 'secrets' in s else s
          v=gj('https://api.github.com/repos/chepin-ai/vci-vinf/actions/variables?per_page=50')
          rec['vars']=[x['name'] for x in v.get('variables',[])] if isinstance(v,dict) and 'variables' in v else v
          os.makedirs('receipts',exist_ok=True)
          json.dump(rec,open('receipts/VINF-SECRETS-01.json','w'),ensure_ascii=False,indent=1)
          print(json.dumps(rec)[:200])
          PYEOF
      - name: 回执落仓
        run: |
          git config user.name "probe"; git config user.email "probe@ci"
          git add receipts/ && git commit -qm "VINF-SECRETS-01 [skip ci]" && git push -q || echo push-fail
