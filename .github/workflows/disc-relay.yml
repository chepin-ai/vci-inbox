name: disc-relay
on:
  repository_dispatch:
    types: [qf-beat]   # QF-OS事件主道(root令⑥ fold-n清除)
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: disc-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 投递式发帖（outbox DISC-POST→disc）+ 大厅镜像（disc→lobby）
        env:
          LOBBY: ${{ vars.LOBBY_ISSUE }}
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYE'
          import json,os,glob,hashlib,datetime,urllib.request,re,time,base64 as b64
          GH=os.environ['GH']; LOBBY=os.environ.get('LOBBY','1')
          NL=chr(10)
          def api(m,u,body=None):
              r=urllib.request.Request('https://api.github.com'+u,method=m,headers={'Authorization':'Bearer '+GH,'Accept':'application/vnd.github+json'})
              if body is not None:
                  r.data=json.dumps(body).encode(); r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r) as resp: return resp.status,resp.read()
              except Exception as e: return getattr(e,'code',str(e)[:40]),None
          TS=datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%dT%H:%M:%SZ')
          day=datetime.datetime.now(datetime.UTC).strftime('%Y%m%d')
          st=json.load(open('bridge/relayed-state.json'))
          ms=json.load(open('bridge/mirror-state.json'))
          def tail_digest():
              if not os.path.exists('disc/CHAIN.jsonl'): return 'genesis'
              lines=open('disc/CHAIN.jsonl').read().strip().splitlines()
              return json.loads(lines[-1])['digest'] if lines else 'genesis'
          urls={}
          reg=json.load(open('bridge/registry.json'))
          for k,v in reg.get('lines',{}).items():
              if v.get('url'): urls[k]=v['url']
          s,ob=api('GET','/repos/chepin-ai/ci-control/contents/bridge/outboxes.json')
          if s==200:
              obx=json.loads(b64.b64decode(json.loads(ob)['content']))
              for k,v in obx.get('sessions',{}).items():
                  if v.get('url'): urls.setdefault(k,v['url'])
          newposts=0
          for line,url in sorted(urls.items()):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'disc-relay'}),timeout=20) as r:
                      data=json.loads(r.read())
              except Exception: continue
              for it in (data.get('items') or []):
                  iid=str(it.get('id',''))
                  if not iid or iid in st['relayed']: continue
                  if it.get('type')!='DISC-POST' and not str(it.get('dtag','')).startswith('disc-post:'): continue
                  body=str(it.get('body','')).strip()
                  if not body: continue
                  slug=re.sub(r'[^a-zA-Z0-9-]+','-',str(it.get('dtag','post')).replace('disc-post:',''))[:40]
                  fname='disc/%s-%s.md'%(line,slug)
                  if os.path.exists(fname): continue
                  dg=hashlib.sha256((body+NL).encode()).hexdigest()[:16]
                  post_id='%s-%s-%s'%(line,day,iid.split('-')[-1])
                  fm='---'+NL+'schema: DISC-01'+NL+'post_id: '+post_id+NL+'thread: '+str(it.get('thread','OPS'))+NL+'author: '+line+NL+'to: "'+str(it.get('to','all'))+'"'+NL+'in_reply_to: "'+str(it.get('in_reply_to','-'))+'"'+NL+'prev: '+tail_digest()+NL+'ts: '+str(it.get('ts',TS))+NL+'digest: '+dg+NL+'---'+NL
                  open(fname,'w').write(fm+body+NL)
                  st['relayed'].append(iid); newposts+=1
                  print('RELAYED',line,iid,'->',fname)
          st['relayed']=st['relayed'][-200:]
          # ---- 大厅镜像腿 v2：只认 DISC-01 信封/摆渡件/接引卡；201 才记账；失败留账重试 ----
          mirrored=set(ms['mirrored'])
          DOCSKIP={'INDEX.md','README.md','READING.md','PROTOCOL.md','QFOS-01-DOCS.md','DISC-POST.md'}
          report={'ts':TS,'lobby':LOBBY,'results':[]}
          cands=[]
          for f in sorted(glob.glob('disc/*.md')):
              base=os.path.basename(f)
              if base in DOCSKIP or base in mirrored: continue
              txt=open(f).read()
              m=re.match(r'^---'+NL+'(.*?)'+NL+'---'+NL,txt,re.S)
              meta={}
              if m:
                  for ln2 in m.group(1).splitlines():
                      if ':' in ln2:
                          k,v=ln2.split(':',1); meta[k.strip()]=v.strip().strip('"')
              if base.startswith('from-'):
                  meta={'post_id':base[:-3],'author':base[5:-3],'thread':'FERRY','ts':'9999'}
                  bodytxt=txt
              elif base.startswith('GUEST-'):
                  meta={'post_id':base[:-3],'author':base[6:-3],'thread':'INTAKE','ts':'9999'}
                  bodytxt=txt
              elif not meta.get('post_id'):
                  report['results'].append({'file':base,'status':'skip-no-envelope'})
                  continue
              else:
                  bodytxt=txt.split('---',2)[-1].strip()
              cands.append((meta.get('ts','9999'),base,meta,bodytxt))
          cands.sort(key=lambda x:(x[0],x[1]))
          for tsx,base,meta,bodytxt in cands:
              exc=bodytxt.replace(NL,' ')[:220]
              link='https://github.com/chepin-ai/vci-inbox/blob/main/disc/'+base
              cbody='**[讨论室镜像]** `%s` · 作者 **%s** · 线 `%s`'%(meta.get('post_id',base),meta.get('author','?'),meta.get('thread','?'))+NL+NL+exc+'…'+NL+NL+'[正本]('+link+')'
              s,resp=api('POST','/repos/chepin-ai/vci-inbox/issues/'+LOBBY+'/comments',{'body':cbody})
              print('MIRROR',base,'->',s)
              if s==201:
                  ms['mirrored'].append(base)
                  cid='?'
                  try: cid=json.loads(resp).get('id','?')
                  except Exception: pass
                  report['results'].append({'file':base,'status':201,'comment_id':cid})
              else:
                  report['results'].append({'file':base,'status':str(s)})
              time.sleep(3)
          ms['mirrored']=ms['mirrored'][-400:]
          json.dump(st,open('bridge/relayed-state.json','w'),indent=1)
          json.dump(ms,open('bridge/mirror-state.json','w'),indent=1)
          json.dump(report,open('bridge/mirror-report.json','w'),indent=1,ensure_ascii=False)
          print('NEWPOSTS',newposts,'MIRRORED',sum(1 for r in report['results'] if r.get('status')==201),'FAILED',sum(1 for r in report['results'] if r.get('status') not in (201,'skip-no-envelope')))
          PYE
          git config user.name 'disc-relay[bot]'; git config user.email 'bot@users.noreply.github.com'
          git add disc bridge/relayed-state.json bridge/mirror-state.json bridge/mirror-report.json
          git diff --cached --quiet && { echo "no relay"; exit 0; }
          git commit -m "disc-relay: 投递入册+大厅镜像"
          for i in 1 2 3; do git pull --rebase -q origin HEAD 2>/dev/null; git push -q && break; sleep 5; done
          echo "RELAY-OK $(date -u +%FT%TZ)"
