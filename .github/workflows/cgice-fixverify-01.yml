# CLASSIFY-01: L1(公仓·零密钥)
# CGICE-FIXVERIFY-01 v10 · 枢/PIVOT-01 · R26修复件编译验证(快循环@CACHE_OK rev 2f3d8f63)·靶=V20_R26FIX
name: CGICE-FIXVERIFY-01
on:
  push:
    paths:
      - .github/workflows/cgice-fixverify-01.yml
      - library/cgice/Spacetime_Formal_Proof_V20_R26FIX.lean
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixverify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install elan (manual)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc2
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: setup project
        run: |
          mkdir -p _build && cd _build
          echo "leanprover/lean4:v4.35.0-rc2" > lean-toolchain
          printf 'name = "cgicev20fix"\n\n[[require]]\nname = "mathlib"\ngit = "https://github.com/leanprover-community/mathlib4.git"\nrev = "2f3d8f63005779e9d708eb9adf3feca54aa24ceb"\n' > lakefile.toml
          cp ../library/cgice/Spacetime_Formal_Proof_V20_R26FIX.lean .
      - name: resolve mathlib + cache
        run: cd _build && lake update && lake exe cache get
      - name: compile FIX (verdict step)
        id: comp
        run: |
          cd _build
          set +e
          START=$(date +%s)
          lake env lean Spacetime_Formal_Proof_V20_R26FIX.lean > compile.log 2>&1
          RC=$?
          set -e
          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "elapsed=$(($(date +%s)-START))s" >> $GITHUB_OUTPUT
          echo "=== error census ==="; grep -c 'error' compile.log || true; grep -n 'error' compile.log | head -30 || true
      - name: verdict receipt to board
        if: always()
        env:
          RC: ${{ steps.comp.outputs.rc }}
          EL: ${{ steps.comp.outputs.elapsed }}
        run: |
          python3 - <<'PYEOF'
          import subprocess,datetime,hashlib,os
          ts=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
          try: log=open('_build/compile.log').read()
          except Exception: log='<no compile.log>'
          rc=os.environ.get('RC','?'); el=os.environ.get('EL','?')
          sha=hashlib.sha256(open('library/cgice/Spacetime_Formal_Proof_V20_R26FIX.lean','rb').read()).hexdigest()
          verdict='FIX_COMPILE_OK' if rc=='0' else ('FIX_COMPILE_FAIL' if rc.lstrip('-').isdigit() else 'PIPELINE_ABORT')
          head=['CLASSIFY: L1(公域板面·零密钥)','# CGICE-FIXVERIFY-01 修复件编译裁决回执 · '+ts,'',
                '靶件: library/cgice/Spacetime_Formal_Proof_V20_R26FIX.lean (R26修复版·5处defeq级联→稳健链)',
                'fix sha256: '+sha,'原件 sha256: 0944d696ce61e6e4150f84be8f107837e588f7d8ba1655c14964f89419c71d48',
                'toolchain: leanprover/lean4:v4.35.0-rc2','mathlib: 2f3d8f63005779e9d708eb9adf3feca54aa24ceb (CACHE_OK快循环rev)',
                '裁决: **'+verdict+'** (rc='+rc+' · 编译耗时'+el+')','',
                '## compile.log 尾部','```',log[-1600:],'```']
          body=chr(10).join(head)
          fn='board/cgice-fixverify-'+ts+'.md'
          open(fn,'w').write(body)
          print('=== RECEIPT ==='); print(body)
          subprocess.run(['git','config','user.name','pivot-01'])
          subprocess.run(['git','config','user.email','pivot@vci-inbox'])
          subprocess.run(['git','add',fn])
          subprocess.run(['git','commit','-m','CGICE-FIXVERIFY-01 '+verdict+' '+ts])
          ok=False
          for i in range(6):
              subprocess.run(['git','fetch','origin','main'])
              subprocess.run(['git','rebase','origin/main'])
              r=subprocess.run(['git','push','origin','HEAD:main'])
              if r.returncode==0: ok=True; break
              import time; time.sleep(8)
          print('PUSH_OK' if ok else 'PUSH_LOST')
          PYEOF
