name: probe-otpphone-seal（诊断密封步,值不出runner,结果落receipts）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 密封 OTP_PHONE（AI_FULL_PAT）
        env:
          TK: ${{ secrets.AI_FULL_PAT }}
        run: |
          pip install -q pynacl
          python3 - <<'PYEOF'
          import os, json, base64, urllib.request, urllib.error
          from nacl.public import PublicKey, SealedBox
          H={'Authorization':'token '+os.environ['TK'],'Accept':'application/vnd.github+json'}
          rec={'probe':'OTPPHONE-SEAL-01','steps':{}}
          def gj(u,tag):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30)
                  rec['steps'][tag]=r.status; return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  rec['steps'][tag]=e.code; return e.code,None
              except Exception as e:
                  rec['steps'][tag]=type(e).__name__; return 0,None
          s,v=gj('https://api.github.com/repos/chepin-ai/qlv-lib/actions/variables/OTP_PHONE','read_var')
          if s==200 and v:
              val=v['value']
              s2,pk=gj('https://api.github.com/repos/chepin-ai/vci-inbox/actions/secrets/public-key','pubkey')
              if s2==200:
                  sealed=SealedBox(PublicKey(pk['key'],base64.StdEncoding)).encrypt(val.encode())
                  try:
                      req=urllib.request.Request('https://api.github.com/repos/chepin-ai/vci-inbox/actions/secrets/OTP_PHONE',
                          data=json.dumps({'encrypted_value':base64.b64encode(sealed).decode(),'key_id':pk['key_id']}).encode(),
                          headers=H,method='PUT')
                      rec['steps']['put']=urllib.request.urlopen(req,timeout=30).status
                  except urllib.error.HTTPError as e: rec['steps']['put']=e.code
                  del val,sealed
          os.makedirs('receipts',exist_ok=True)
          json.dump(rec,open('receipts/OTPPHONE-SEAL-01.json','w'),ensure_ascii=False,indent=1)
          print(json.dumps(rec))
          PYEOF
      - name: 回执落仓
        run: |
          git config user.name "probe"; git config user.email "probe@ci"
          git add receipts/ && git commit -qm "OTPPHONE-SEAL-01 [skip ci]" && git push -q || echo push-fail
