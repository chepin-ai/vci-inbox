name: circle-refresh
on:
  workflow_dispatch:
    inputs:
      cause: { required: false, default: 'manual' }
  repository_dispatch:
    types: [qf-beat]
permissions:
  contents: write
  # rationale: 收割各线私仓annex(hall/session-inbox)→hub汇聚; 圈状态快照; 超时圈自动触发接力FINDING; 全程只动私域+哈希,零内容泄公
concurrency:
  group: circle-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: "三圈刷新: annex收割→圈状态→超时接力"
        env:
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
          CAUSE: ${{ github.event.inputs.cause || github.event_name }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF'
          import os,json,urllib.request,urllib.error,urllib.parse,datetime,base64,hashlib
          HK=os.environ['HUBK']; HID=os.environ['HUBID']
          import jwt as JW
          now=int(datetime.datetime.now().timestamp())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':HID},HK,algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'circle-refresh'})
          IT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          H={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','User-Agent':'circle-refresh'}
          def g(u):
              rq=urllib.request.Request(u,headers=H)
              try: return json.loads(urllib.request.urlopen(rq,timeout=20).read().decode())
              except urllib.error.HTTPError as e: return {'_s':e.code}
          def getc(repo,path):
              d=g(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{urllib.parse.quote(path)}')
              if isinstance(d,dict) and d.get('content'): return base64.b64decode(d['content']).decode(),d['sha']
              return None,None
          def putc(repo,path,content,msg):
              _,sha=getc(repo,path)
              body={'message':msg,'content':base64.b64encode(content.encode()).decode()}
              if sha: body['sha']=sha
              rq=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{urllib.parse.quote(path)}',method='PUT',headers=H,data=json.dumps(body).encode())
              try: return urllib.request.urlopen(rq,timeout=20).status
              except urllib.error.HTTPError as e: return e.code
          import time
          TS=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          VAULTS=['usrm-repo','quantum-go-ledger','vinf-market-kernel','github-repo-cfts','ucif2-formalization-kernel']
          # (a) annex 收割: <vault>/hall/** → ci-control/bridge/hall/<line>/ ; session/inbox → session-circle
          harvested=[]
          for v in VAULTS:
              for sub,dst in (('hall','hall'),('session/inbox','session-circle')):
                  d=g(f'https://api.github.com/repos/chepin-ai/{v}/contents/{sub}')
                  if not isinstance(d,list): continue
                  for f in d:
                      if f['type']!='file': continue
                      txt,_=getc(v,sub+'/'+f['name'])
                      if txt is None: continue
                      h=hashlib.sha256(txt.encode()).hexdigest()
                      _,oldsha=getc('ci-control',f'bridge/{dst}/{v}/{f["name"]}')
                      # 幂等: 已有同内容则跳(以哈希注解文件判)
                      note=getc('ci-control',f'bridge/{dst}/{v}/.hashes.json')[0]
                      notes=json.loads(note) if note else {}
                      if notes.get(f['name'])==h: continue
                      st=putc('ci-control',f'bridge/{dst}/{v}/{f["name"]}',txt,f'circle-refresh: {dst}收割 {v}/{f["name"]}')
                      if st in (200,201):
                          notes[f['name']]=h
                          putc('ci-control',f'bridge/{dst}/{v}/.hashes.json',json.dumps(notes,sort_keys=True),f'circle-refresh: hash-note {v}')
                          harvested.append(f'{v}/{sub}/{f["name"]}')
          # (b) 圈状态快照
          led,_=getc('ci-control','bridge/stream-ledger.jsonl')
          head=hashlib.sha256((led.strip().split(chr(10))[-1]).encode()).hexdigest()[:16] if led else None
          state={'ts':TS,'forward_circle':{'stream_ledger_head':head,'harvested_this_run':len(harvested)},
                 'session_circle':{v:('present' if not isinstance(g(f'https://api.github.com/repos/chepin-ai/{v}/contents/session'),dict) else 'absent') for v in VAULTS},
                 'consensus_circle':'beacon seq 见 vci-inbox capsules/INTAKE-LATEST(公面最小胶囊)'}
          putc('ci-control','bridge/circle-state.json',json.dumps(state,ensure_ascii=False,indent=1),f'circle-refresh: 圈状态 {TS}')
          # (c) 账
          old,_=getc('ci-control','bridge/stream-ledger.jsonl')
          if not old:  # EMPTY-READ-GENESIS-01闸: 瞬败重试一拍再判
              import time as _tm; _tm.sleep(2)
              old,_=getc('ci-control','bridge/stream-ledger.jsonl')
          _ls=[json.loads(x) for x in (old or '').split(chr(10)) if x.strip()]
          _seq=max([x.get('seq',0) for x in _ls]+[0])+1  # LEGISL-06自愈立法: CIRCLE-REFRESH须带seq
          _ph='0'*64
          for _x in reversed(_ls):
              if _x.get('hash'): _ph=_x['hash']; break
          _bp=None
          if _ph=='0'*64:  # EMPTY-READ-GENESIS-01闸(LEGISL-33): 空读/断链≠零哈希接龙; 无旗拒入链, 落FINDING而嚎
              _bp,_=getc('ci-control','bridge/ledger-archive/BOOTSTRAP.permit')
              if not _bp:
                  putc('ci-control','bridge/findings/FINDING-EMPTY-READ-'+TS+'.json',json.dumps({'type':'FINDING','pattern':'EMPTY-READ-GENESIS-01','by':'circle-refresh','ts':TS,'detail':'ledger空读/读败/无hash件且无BOOTSTRAP.permit旗, 拒入链, 账段中止(快照段已行)'},ensure_ascii=False),'FINDING 空读拒入链 '+TS)
          if _ph!='0'*64 or _bp:
              e={'seq':_seq,'ts':TS,'kind':'CIRCLE-REFRESH','actor':'circle-refresh','prev':_ph,'harvested':len(harvested),'items':harvested[:20]}  # v2.1修:prev字段入件(原仅入哈希=prev链断,e144事故)
              prevh=_ph
              e['hash']=hashlib.sha256((prevh+json.dumps(e,sort_keys=True,ensure_ascii=False,separators=(',',':'))).encode()).hexdigest()
              putc('ci-control','bridge/stream-ledger.jsonl',(old.rstrip(chr(10))+chr(10) if old else '')+json.dumps(e,ensure_ascii=False)+chr(10),'circle-refresh 入链')
          print(json.dumps({'harvested':len(harvested),'items':harvested[:10]},ensure_ascii=False))
          # 备份道(D-139): 每班末叩 intake-agent+fleet-judge 各一次——30min cron自启滞后期间,保证≥2h一班兜底(ENGINE-FLEET-01§4)
          # QUOTA-SELF-DEVOUR-01闸(LEGISL-35): 备份叩门冷却7200s/目标(原义=2h兜底,非常态驱动)
          _ks_txt,_=getc('ci-control','bridge/knock-state.json')
          _ks=json.loads(_ks_txt) if _ks_txt else {}
          _nown=datetime.datetime.now(datetime.timezone.utc).timestamp()
          _knocked=[]
          for _wf in ('intake-agent.yml','fleet-judge.yml','kernel-loop.yml'):
              if (_nown-_ks.get('cr:'+_wf,0))<=7200:
                  print(f'{_wf} backup-knock: cooldown-skip'); continue
              try:
                  rq=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/vci-inbox/actions/workflows/{_wf}/dispatches',data=json.dumps({'ref':'main','inputs':{'cause':'beat-forward'}}).encode(),method='POST',headers=H())
                  print(f'{_wf} backup-knock:',urllib.request.urlopen(rq,timeout=15).status)
                  _knocked.append(_wf)
              except Exception as _e: print(f'{_wf} backup-knock fail(下一班再试):',str(_e)[:60])
          if _knocked:
              for _w in _knocked: _ks['cr:'+_w]=_nown
              putc('ci-control','bridge/knock-state.json',json.dumps(_ks),'knock冷却记账 '+TS)
          PYEOF
