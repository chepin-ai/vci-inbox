name: line-sense
on:
  schedule:
    - cron: '17 */2 * * *'  # 每2h错峰
  workflow_dispatch: {}
jobs:
  sense:
    runs-on: ubuntu-latest
    steps:
      - name: line-sense (链头cursor差分+2h SLA计时+新件落intake)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,datetime,urllib.request,urllib.error,urllib.parse,base64,hashlib
          def it_of(k,i,inst):
              now=int(time.time())
              t=jwt.encode({'iat':now-90,'exp':now+540,'iss':i},k,algorithm='RS256')
              r=urllib.request.Request(f'https://api.github.com/app/installations/{inst}/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'line-sense'})
              return json.load(urllib.request.urlopen(r))['token']
          HUB=it_of(os.environ['HUB_KEY'],os.environ['HUB_ID'],'154355791')
          LINE=it_of(os.environ['LINE_KEY'],os.environ['LINE_ID'],'155768871')
          B='https://api.github.com/repos/chepin-ai'
          def gh(tok,m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+tok,'Accept':'application/vnd.github+json','User-Agent':'line-sense'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,None
          def getj(tok,repo,path):
              s,c=gh(tok,'GET',f'{B}/{repo}/contents/{urllib.parse.quote(path)}')
              if s!=200: return None
              try: return json.loads(base64.b64decode(c['content']).decode())
              except Exception: return None
          def putc(repo,path,obj,msg):
              text=json.dumps(obj,ensure_ascii=False,indent=2) if not isinstance(obj,str) else obj
              s,old=gh(HUB,'GET',f'{B}/{repo}/contents/{urllib.parse.quote(path)}')
              d={'message':msg,'content':base64.b64encode(text.encode()).decode()}
              if s==200: d['sha']=old['sha']
              return gh(HUB,'PUT',f'{B}/{repo}/contents/{urllib.parse.quote(path)}',d)[0]
          now=datetime.datetime.now(datetime.timezone.utc)
          ts=now.strftime('%Y-%m-%dT%H:%M:%SZ')
          cur=getj(HUB,'ci-control','bridge/lines/cursors.json') or {'cursors':{}}
          new_items=[]; sla_alerts=[]; heads={}
          # 面1: usrm narrative(公)
          narr=getj(HUB,'vci-usrm','ure/narrative_outbox.json')
          if narr and narr.get('entries'):
              ent=narr['entries']; head=ent[-1]['seq']; heads['usrm-narrative']=head
              seen=cur['cursors'].get('usrm-narrative',0)
              for it in ent:
                  if it['seq']>seen:
                      new_items.append({'surface':'usrm-narrative','seq':it['seq'],'ts':it.get('ts'),'intent':it.get('intent')})
              cur['cursors']['usrm-narrative']=head
              # SLA: 非RPT件(请求/候件)超2h未ack=报警
              for it in ent[-30:]:
                  itn=it.get('intent') or ''
                  if not itn.startswith(('RPT.','ACK','CARD.')):
                      try:
                          age=(now-datetime.datetime.fromisoformat(it['ts'].replace('Z','+00:00'))).total_seconds()/3600
                          if age>2: sla_alerts.append({'surface':'usrm-narrative','seq':it['seq'],'intent':itn,'age_h':round(age,1)})
                      except Exception: pass
          # 面2: usrm-repo/inbox(line)
          s,lst2=gh(LINE,'GET',f'{B}/usrm-repo/contents/inbox')
          if s==200 and isinstance(lst2,list):
              names=sorted(x['name'] for x in lst2 if x['type']=='file')
              heads['usrm-repo/inbox']=len(names)
              seen2=cur['cursors'].get('usrm-repo/inbox',[])
              for n in names:
                  if n not in seen2: new_items.append({'surface':'usrm-repo/inbox','file':n})
              cur['cursors']['usrm-repo/inbox']=names[-50:]
          # 面3: quafu状态(公)
          qf=getj(HUB,'vci-usrm','weave/quafu/status.json')
          if qf:
              tok_missing=[j for j,v in qf.get('jobs',{}).items() if v.get('status')=='TOKEN_MISSING']
              if tok_missing: sla_alerts.append({'surface':'quafu','issue':'TOKEN_MISSING','jobs':tok_missing,'note':'usrm量子作业轮询缺token=#94根因实证'})
          heads['quafu']='ok' if qf else 'unreachable'
          # 面4: installation覆盖巡边+冲击门(拆installation震动根本解)
          try:
              memb={}
              s,mh=gh(HUB,'GET','https://api.github.com/installation/repositories?per_page=100')
              if s==200: memb['hub']=sorted(x['name'] for x in mh.get('repositories',[]))
              s,ml=gh(LINE,'GET','https://api.github.com/installation/repositories?per_page=100')
              if s==200: memb['line']=sorted(x['name'] for x in ml.get('repositories',[]))
              prev=cur['cursors'].get('installations',{})
              changes=[]
              for side in ('hub','line'):
                  if side not in memb: continue
                  old=set(prev.get(side,[])); new=set(memb[side])
                  if old and old!=new: changes.append({'side':side,'added':sorted(new-old),'removed':sorted(old-new)})
              cur['cursors']['installations']=memb
              if changes:
                  reg0=getj(HUB,'ci-control','bridge/CHANNELS-REG-01.json') or {'channels':[]}
                  impacted=[]
                  for ch in changes:
                      for repo in ch['added']+ch['removed']:
                          edge=ch['side']+':'+repo
                          for c0 in reg0.get('channels',[]):
                              if any(edge==d or edge in d for d in c0.get('deps',[])): impacted.append({'channel':c0['name'],'edge':edge})
                  sla_alerts.append({'surface':'installations','issue':'MEMBERSHIP_CHANGE','changes':changes,'impacted_channels':impacted})
              heads['installations']={k:len(v) for k,v in memb.items()}
          except Exception as e: heads['installations']='err:'+str(e)[:60]
          # 落账: intake jsonl + cursor + verdict
          if new_items:
              day=now.strftime('%Y%m%d')
              s0,old=gh(HUB,'GET',f'{B}/ci-control/contents/bridge/intake/IN-{day}.jsonl')
              prev=''
              if s0==200: prev=base64.b64decode(old['content']).decode()
              body=prev+''.join(json.dumps({**x,'sensed':ts},ensure_ascii=False)+chr(10) for x in new_items)
              putc('ci-control',f'bridge/intake/IN-{day}.jsonl',body,f'line-sense intake +{len(new_items)}')
          verdict={'ts':ts,'heads':heads,'new':len(new_items),'sla_alerts':sla_alerts}
          putc('ci-control','bridge/lines/line-sense-latest.json',verdict,'line-sense tick')
          putc('ci-control','bridge/lines/cursors.json',cur,'line-sense cursors')
          print(json.dumps(verdict,ensure_ascii=False)[:800])
          PYEOF
