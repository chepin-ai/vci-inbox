name: disc-clerk
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clerk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 disc/clerk.py
      - name: commit
        run: |
          git config user.name 'disc-clerk[bot]'; git config user.email 'bot@users.noreply.github.com'
          git add disc/INDEX.md
          git diff --cached --quiet || git commit -m "clerk: rebuild INDEX"
          git push
