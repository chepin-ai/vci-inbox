name: disc-clerk
on:
  workflow_run:
    workflows: [kernel-loop]
    types: [completed]
  repository_dispatch:
    types: [qf-beat]   # QF-OS事件主道(root令⑥ fold-n清除)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: disc-clerk
  cancel-in-progress: true
jobs:
  clerk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 disc/clerk.py
      - name: commit
        run: |
          git config user.name 'disc-clerk[bot]'; git config user.email 'bot@users.noreply.github.com'
          git add disc/
          git diff --cached --quiet || git commit -m "clerk: rebuild INDEX+CHAIN"
          for i in 1 2 3; do git pull --rebase -q origin HEAD 2>/dev/null; git push && break; sleep 5; done
