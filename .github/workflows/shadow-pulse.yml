name: shadow-pulse
# 公域影子引擎脉冲：消费对线公域 outbox → weave/pulse/ 快照 + pulse.log 哈希链
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [shadow-pulse]
  push:
    paths: ['engine/**']
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 脉冲
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, datetime, hashlib
          # SHADOW-REVIVAL-01 枢/PIVOT-01代修: ①注册表迁址追从(ci-control私仓化→vci-inbox公面正本registry.json)
          # ②sessions→lines新schema ③零密钥化(公仓raw匿名可达,App令牌退役,合本仓零密钥铁律) ④单拍全线织(原仅单线空转)
          ts=datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S')
          UA={'User-Agent':'shadow-pulse'}
          def get(u):
              req=urllib.request.Request(u,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.read()
              except Exception as e: return getattr(e,'code',0),b''
          s,raw=get('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/registry.json')
          recs=[]
          if s==200:
              for line,ent in (json.loads(raw).get('lines') or {}).items():
                  url=(ent or {}).get('url'); rec={'line':line,'outbox':None,'note':''}
                  if url:
                      s2,body=get(url)
                      rec['outbox']={'url_sha':hashlib.sha256(url.encode()).hexdigest()[:16],'http':s2,
                                     'sha256':hashlib.sha256(body).hexdigest()[:16] if s2==200 else None}
                      rec['note']='snapshot ok' if s2==200 else 'outbox unreachable'
                  else: rec['note']='no url'
                  recs.append(rec)
          else: recs=[{'line':None,'outbox':None,'note':'registry unreachable http=%s'%s}]
          rec={'ts':ts,'pulses':recs}
          os.makedirs('weave/pulse',exist_ok=True)
          p='weave/pulse/%s.json'%ts
          open(p,'w').write(json.dumps(rec,ensure_ascii=False,indent=1))
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()[:16]
          with open('pulse.log','a') as f:
              for r in recs: f.write('%s %s %s %s\n'%(ts,r['line'],h,r['note']))
          print(json.dumps(rec,ensure_ascii=False)[:1200])
          PYEOF
      - name: 自提交成链
        run: |
          git config user.name "shadow-pulse[bot]"; git config user.email "shadow-pulse@users.noreply.github.com"
          git add weave/pulse pulse.log || true
          git commit -m "pulse $(date -u +%Y%m%d-%H%M%S) $LINE" || echo "无变更"
          # fetch-first 修复（A2 实证：并发班次 push 被拒）——push 前 pull --rebase，失败重试×3
          ok=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && { ok=1; break; }
            echo "push 被拒（第 $i 次），rebase 后重试"
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "::error::push 三连败，留待下一班"; exit 1; }
