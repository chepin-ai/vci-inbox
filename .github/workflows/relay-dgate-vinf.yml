name: relay-dgate-vinf
on:
  workflow_dispatch:
    inputs:
      act:
        required: true
        default: sendcode
      code:
        required: false
        default: ""
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 推 otp-dispatch-gate 入 vci-vinf + 点火
        env:
          TK: ${{ secrets.AI_FULL_PAT }}
          ACT: ${{ github.event.inputs.act }}
          CODE_IN: ${{ github.event.inputs.code }}
        run: |
          B64=$(base64 -w0 payloads/otp-dispatch-gate.yml)
          SHA=$(curl -s -H "Authorization: token $TK" "https://api.github.com/repos/chepin-ai/vci-vinf/contents/.github/workflows/otp-dispatch-gate.yml" | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" || true)
          if [ -n "$SHA" ]; then BODY="{\"message\":\"otp-dispatch-gate\",\"content\":\"$B64\",\"sha\":\"$SHA\"}"; else BODY="{\"message\":\"otp-dispatch-gate\",\"content\":\"$B64\"}"; fi
          curl -s -o /dev/null -w "push %{http_code}\n" -X PUT -H "Authorization: token $TK" -d "$BODY" "https://api.github.com/repos/chepin-ai/vci-vinf/contents/.github/workflows/otp-dispatch-gate.yml"
          sleep 8
          if [ "$ACT" = "verify" ]; then PAYLOAD="{\"ref\":\"main\",\"inputs\":{\"action\":\"verify\",\"code\":\"$CODE_IN\"}}"; else PAYLOAD="{\"ref\":\"main\",\"inputs\":{\"action\":\"sendcode\"}}"; fi
          curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST -H "Authorization: token $TK" -H "Accept: application/vnd.github+json" -d "$PAYLOAD" "https://api.github.com/repos/chepin-ai/vci-vinf/actions/workflows/otp-dispatch-gate.yml/dispatches"
