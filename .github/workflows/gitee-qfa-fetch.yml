name: gitee-qfa-fetch
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch sealed dir
        env:
          GT: ${{ secrets.GITEE_MIRROR_PAT }}
        run: |
          python3 - <<'PYEOF'
          import os,json,urllib.request,base64,datetime
          T=os.environ['GT']
          def g(u):
              r=urllib.request.Request(u,headers={'User-Agent':'cisvr','Authorization':'token '+T})
              try:
                  x=urllib.request.urlopen(r,timeout=20); return x.status,x.read().decode()
              except Exception as e: return getattr(e,'code',0),None
          out={'ts':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
          s,tree=g('https://gitee.com/api/v5/repos/chepin-ci/qfa-line/contents/sealed')
          out['sealed_status']=s
          if s==200:
              files=json.loads(tree)
              out['sealed_files']=[{'name':f['name'],'size':f['size']} for f in files]
              for f in files:
                  s2,c=g(f['url'])
                  if s2==200:
                      raw=base64.b64decode(json.loads(c)['content'])
                      open('sealed_'+f['name'],'wb').write(raw)
                      out.setdefault('fetched',[]).append(f['name'])
          print(json.dumps(out,ensure_ascii=False))
          with open('bridge/qfa/sealed-fetch-result.json','w') as fp: json.dump(out,fp,ensure_ascii=False,indent=1)
          PYEOF
      - name: commit
        run: |
          git config user.name gitee-fetch; git config user.email fetch@local
          git add bridge/qfa/sealed-fetch-result.json sealed_* 2>/dev/null || git add bridge/qfa/sealed-fetch-result.json
          git commit -m "qfa sealed fetch [skip ci]" -q || echo noop
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 3; done
