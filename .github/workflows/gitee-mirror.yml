name: gitee-mirror
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitee-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        repo: [ci-control, qlv-lab, vci-inbox]
    steps:
      - name: 门闸 + 鉴权自检 + 建仓(私有,若缺) + 镜像推送（值不打印）
        env:
          PAT: ${{ secrets.GITEE_MIRROR_PAT }}
          APPK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          if [ -z "$PAT" ] || [ -z "$APPK" ]; then echo "IDLE: secrets 未落"; exit 0; fi
          set -e
          printf '%s' "$APPK" > /tmp/hub.pem
          pip install -q pyjwt cryptography
          cat > /tmp/mint.py <<'PYE'
          import jwt,time,json,urllib.request,os
          now=int(time.time())
          t=jwt.encode({'iat':now-60,'exp':now+540,'iss':os.environ['HUB_ID']},open('/tmp/hub.pem').read(),algorithm='RS256')
          H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
          inst=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)).read())
          iid=[i['id'] for i in inst if i['account']['login']=='chepin-ai'][0]
          r=urllib.request.Request('https://api.github.com/app/installations/%s/access_tokens'%iid,method='POST',headers=H); r.data=b'{}'
          print(json.loads(urllib.request.urlopen(r).read())['token'])
          PYE
          IT=$(python3 /tmp/mint.py)
          rm -f /tmp/hub.pem /tmp/mint.py
          REAL=$(curl -s --max-time 25 "https://gitee.com/api/v5/user?access_token=${PAT}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('login',''))")
          [ -n "$REAL" ] || { echo 'FATAL: PAT 鉴权失败'; exit 1; }
          R="${{ matrix.repo }}"
          code=$(curl -s --max-time 25 -o /dev/null -w '%{http_code}' "https://gitee.com/api/v5/repos/${REAL}/${R}-mirror?access_token=${PAT}")
          if [ "$code" = "404" ]; then
            mk=$(curl -s --max-time 40 -X POST "https://gitee.com/api/v5/user/repos" -d "access_token=${PAT}" -d "name=${R}-mirror" -d "private=true" -o /dev/null -w '%{http_code}')
            echo "create ${R}-mirror http=${mk}"; [ "$mk" = "201" ] || exit 1
          else
            echo "远端 ${R}-mirror http=${code}"
          fi
          git clone -q --mirror "https://x-access-token:${IT}@github.com/chepin-ai/${R}.git" /tmp/m.git
          cd /tmp/m.git
          timeout 420 git push --mirror "https://${REAL}:${PAT}@gitee.com/${REAL}/${R}-mirror.git" && echo "MIRROR-OK ${R} $(date -u +%FT%TZ)"
