name: pat-fp-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fp probe
        env:
          PAT: ${{ secrets.AI_FULL_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import hashlib,json,os,subprocess,urllib.request,urllib.error
          pat=os.environ.get('PAT','')
          fp=hashlib.sha256(pat.encode()).hexdigest()[:12] if pat else 'EMPTY'
          res={'fp12':fp}
          def probe(url):
              r=urllib.request.Request(url,headers={'Authorization':'token '+pat,'Accept':'application/vnd.github+json','User-Agent':'fp-probe'})
              try:
                  x=urllib.request.urlopen(r,timeout=20); return x.status,json.loads(x.read().decode())
              except urllib.error.HTTPError as e: return e.code,{}
              except Exception as e: return 'ERR',{}
          s,b=probe('https://api.github.com/user')
          res['user_status']=s; res['login']=b.get('login','-')
          s2,_=probe('https://api.github.com/repos/chepin-ai/ci-control')
          res['read_ci_control']=s2
          s3,_=probe('https://api.github.com/repos/chepin-ai/vci-inbox')
          res['read_vci_inbox']=s3
          json.dump(res,open('pat-fp-probe.json','w'),ensure_ascii=False,indent=1)
          print('fp12',fp,'user',res['user_status'],res['login'],'ci-control',s2)
          PYEOF
          git config user.name cisvr-probe; git config user.email probe@local
          git add pat-fp-probe.json
          git commit -m "pat-fp-probe result [skip ci]" -q
          git push "https://x-access-token:${GH_TOKEN}@github.com/chepin-ai/vci-inbox.git" HEAD:main -q
