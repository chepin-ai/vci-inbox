name: probe-pat-admin
on: [workflow_dispatch]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          AI_PAT: ${{ secrets.AI_FULL_PAT }}
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request,urllib.error
          def api(m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+os.environ['AI_PAT'],'Accept':'application/vnd.github+json'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:150]
          s,_=api('PATCH','https://api.github.com/repos/chepin-ai/ci-control-backup',{'archived':True})
          print('archive probe:',s)
          if s==200:
              s2,_=api('PATCH','https://api.github.com/repos/chepin-ai/ci-control-backup',{'archived':False})
              print('unarchive rollback:',s2)
          s3,me=api('GET','https://api.github.com/user')
          print('PAT auth_as:',me.get('login') if s3==200 else s3)
          PYEOF
