name: relay-qlvlib-otp3
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: "QLVLIB-OTP3-01: OTP三件内存中继+复跑回测6/6"
        env:
          RELAY_PAT: ${{ secrets.AI_FULL_PAT }}
          V1: ${{ secrets.TMP_QLV_OTP_PHONE }}
          V2: ${{ secrets.TMP_QLV_OTP_EMAIL1 }}
          V3: ${{ secrets.TMP_QLV_OTP_EMAIL2 }}
        run: |
          python3 - <<'PYEOF'
          import os, json, base64, urllib.request, urllib.error, time, re
          PAT=os.environ['RELAY_PAT']
          VALS={'OTP_PHONE':os.environ['V1'],'OTP_EMAIL1':os.environ['V2'],'OTP_EMAIL2':os.environ['V3']}
          O='chepin-ai'; REPO='qlv-lib'; GH='https://api.github.com'
          T0=time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          def H(): return {'Authorization':'token '+PAT,'Accept':'application/vnd.github+json','User-Agent':'cisvr-relay'}
          def api(m,u,d=None):
              rq=urllib.request.Request(u,method=m,headers=H())
              if d is not None: rq.data=json.dumps(d).encode()
              try:
                  r=urllib.request.urlopen(rq,timeout=30); b=r.read().decode(); return r.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:200]
          rep={'relay':'QLVLIB-OTP3-01','t0':T0,'steps':{}}
          for n,v in VALS.items():
              s,_=api('POST',f'{GH}/repos/{O}/{REPO}/actions/variables',{'name':n,'value':v})
              if s==409: s,_=api('PATCH',f'{GH}/repos/{O}/{REPO}/actions/variables/{n}',{'name':n,'value':v})
              rep['steps'][n]=s
          s5,_=api('POST',f'{GH}/repos/{O}/{REPO}/actions/workflows/qlv-lib-poller.yml/dispatches',{'ref':'main'})
          rep['steps']['dispatch_poller']=s5
          ver='PENDING'; detail={}
          for _ in range(9):
              time.sleep(20)
              s6,c6=api('GET',f'{GH}/repos/{O}/{REPO}/contents/receipts_last.jsonl')
              if s6!=200: continue
              txt=base64.b64decode(c6['content']).decode()
              m=re.search(r'"ts": "([^"]+)"', txt); r=re.search(r'"result": (\{[^}]+\})', txt)
              if m and r and m.group(1)>=T0.replace('Z','')[:19]:
                  detail={'receipt_ts':m.group(1),'present':[k for k,v in json.loads(r.group(1)).items() if v=='present']}
                  ver='PASS' if len(detail['present'])==6 else 'PARTIAL'
                  break
          rep['verify']=ver; rep['cred_selftest']=detail
          print('RELAY-RECEIPT '+json.dumps(rep,ensure_ascii=False))
          PYEOF
