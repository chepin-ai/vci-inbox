name: relay-otpkit-vinf-qfa
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  vinf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: OTP_PHONE密封入vci-vinf secrets(内存中继零打印)
        env:
          AI_PAT: ${{ secrets.AI_FULL_PAT }}
        run: |
          pip install -q pynacl
          python3 - <<'PYEOF'
          import json,os,base64,urllib.request,urllib.error
          from nacl import public,encoding
          def api(m,u,d=None,t=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+(t or os.environ['AI_PAT']),'Accept':'application/vnd.github+json','User-Agent':'otpkit-relay'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:200]
          s,v=api('GET','https://api.github.com/repos/chepin-ai/qlv-lib/actions/variables/OTP_PHONE')
          assert s==200,'src '+str(s); val=v['value']
          s,pk=api('GET','https://api.github.com/repos/chepin-ai/vci-vinf/actions/secrets/public-key')
          assert s==200,'pk '+str(s)
          box=public.SealedBox(public.PublicKey(pk['key'],encoding.Base64Encoder))
          enc=base64.b64encode(box.encrypt(val.encode())).decode(); val=None
          s,r=api('PUT','https://api.github.com/repos/chepin-ai/vci-vinf/actions/secrets/OTP_PHONE',{'encrypted_value':enc,'key_id':pk['key_id']})
          s2,chk=api('GET','https://api.github.com/repos/chepin-ai/vci-vinf/actions/secrets?per_page=100')
          names=[x['name'] for x in chk.get('secrets',[])] if s2==200 else []
          print('vinf OTP_PHONE write',s,'| secrets名:',names)
          PYEOF
  qfa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: qfa套件安装(otp-issue-trigger+worker+OTP×3;QI_PAT写,AI_PAT读源)
        env:
          AI_PAT: ${{ secrets.AI_FULL_PAT }}
          QI_PAT: ${{ secrets.QI_FULL_PAT }}
        run: |
          pip install -q pynacl
          python3 - <<'PYEOF'
          import json,os,base64,urllib.request,urllib.error
          from nacl import public,encoding
          def api(m,u,d=None,t=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+(t or os.environ['AI_PAT']),'Accept':'application/vnd.github+json','User-Agent':'otpkit-relay'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,e.read().decode()[:200]
          AI=os.environ['AI_PAT']; QI=os.environ['QI_PAT']
          # 套件件体:vci-qgl读
          def getf(repo,path):
              s,d=api('GET',f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',t=AI)
              return base64.b64decode(d['content']).decode() if s==200 else None
          wfyml=getf('vci-qgl','.github/workflows/otp-issue-trigger.yml')
          worker=getf('vci-qgl','scripts/otp_gate_worker.py')
          assert wfyml and worker,'kit read fail'
          T='https://api.github.com/repos/chepin-qi/qfa-quantum-lab'
          def put(path,content,msg):
              s,old=api('GET',T+'/contents/'+path,t=QI)
              bd={'message':msg,'content':base64.b64encode(content.encode()).decode()}
              if s==200: bd['sha']=old['sha']
              s2,_=api('PUT',T+'/contents/'+path,bd,t=QI); print(path,s2)
          put('.github/workflows/otp-issue-trigger.yml',wfyml,'OTP-kit: otp-issue-trigger(cisvr代劳,root令⑧)')
          put('scripts/otp_gate_worker.py',worker,'OTP-kit: worker(cisvr代劳,root令⑧)')
          # OTP×3: OTP_PHONE→secret(sealed), EMAIL×2→vars
          s,pk=api('GET',T+'/actions/secrets/public-key',t=QI)
          if s==200:
              s,v=api('GET','https://api.github.com/repos/chepin-ai/qlv-lib/actions/variables/OTP_PHONE',t=AI)
              val=v['value']; box=public.SealedBox(public.PublicKey(pk['key'],encoding.Base64Encoder))
              enc=base64.b64encode(box.encrypt(val.encode())).decode(); val=None
              s2,_=api('PUT',T+'/actions/secrets/OTP_PHONE',{'encrypted_value':enc,'key_id':pk['key_id']},t=QI); print('qfa OTP_PHONE secret',s2)
          for nm in ('OTP_EMAIL1','OTP_EMAIL2'):
              s,v=api('GET',f'https://api.github.com/repos/chepin-ai/qlv-lib/actions/variables/{nm}',t=AI)
              if s==200:
                  val=v['value']
                  s2,_=api('POST',T+'/actions/variables',{'name':nm,'value':val},t=QI)
                  if s2 in (409,422): s2,_=api('PATCH',T+'/actions/variables/'+nm,{'name':nm,'value':val},t=QI)
                  val=None; print('qfa var',nm,s2)
          # 复点
          s,sec=api('GET',T+'/actions/secrets?per_page=100',t=QI)
          print('qfa secrets含OTP_PHONE:', 'OTP_PHONE' in [x['name'] for x in sec.get('secrets',[])] if s==200 else '?')
          s,var=api('GET',T+'/actions/variables?per_page=100',t=QI)
          print('qfa vars:',[x['name'] for x in var.get('variables',[])] if s==200 else '?')
          PYEOF
