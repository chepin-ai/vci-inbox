name: probe-qfa-vars
on: [workflow_dispatch]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - env:
          QI_PAT: ${{ secrets.QI_FULL_PAT }}
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request,urllib.error
          def api(m,u):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+os.environ['QI_PAT'],'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); return x.status,json.loads(x.read().decode())
              except urllib.error.HTTPError as e: return e.code,{}
          s,d=api('GET','https://api.github.com/repos/chepin-qi/qfa-quantum-lab/actions/variables?per_page=100')
          names=sorted(v['name'] for v in d.get('variables',[])) if s==200 else s
          print('qfa vars:',names)
          print('OTP present:',all(k in names for k in ('OTP_PHONE','OTP_EMAIL1','OTP_EMAIL2')) if isinstance(names,list) else '?')
          PYEOF
