name: bridge-poller
on:
  repository_dispatch:
    types: [qf-beat]   # QF-OS事件主道(root令⑥ fold-n清除)
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ferry outboxes -> disc/
        run: python bridge/scripts/poller.py
      - name: commit
        run: |
          git config user.name "bridge-poller[bot]"
          git config user.email "bridge-poller@chepin-ai.local"
          git add disc bridge
          if ! git diff --cached --quiet; then
            git commit -m "bridge-poller: ferry $(date -u +%Y%m%d-%H%M)"
            # FINDING-BRIDGE-POLLER-COMMIT-RACE-01 修法：竞态重试环强化 ×6 + 终败软降（件留源仓，下拍续渡）
            ok=0
            for i in 1 2 3 4 5 6; do
              git fetch -q origin main 2>/dev/null
              git rebase origin/main -q 2>/dev/null || git rebase --abort 2>/dev/null
              if git push -q origin HEAD:main 2>/dev/null; then ok=1; break; fi
              sleep $((i*5))
            done
            [ "$ok" = "1" ] || echo "::warning::ferry push 六次未济，件留源仓下拍续渡（非致命）"
          else
            echo "no new items"
          fi
