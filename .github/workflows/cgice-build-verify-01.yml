# CLASSIFY-01: L1(公仓·零密钥)
# CGICE-BUILD-VERIFY-01 v2 · 枢/PIVOT-01 · F02修复: detached-HEAD推失落赛 + compile速败自检 + 回执stdout免鉴权
name: CGICE-BUILD-VERIFY-01
on:
  push:
    paths:
      - .github/workflows/cgice-build-verify-01.yml
      - library/cgice/Spacetime_Formal_Proof_V20.lean
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: install elan (manual·org白名单外action规避)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc2
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: setup project
        run: |
          mkdir -p _build && cd _build
          echo "leanprover/lean4:v4.35.0-rc2" > lean-toolchain
          printf 'name = "cgicev20"\n\n[[require]]\nname = "mathlib"\ngit = "https://github.com/leanprover-community/mathlib4.git"\nrev = "8d7d0c463a379a6fcad593782d5d8a250a767fc2"\n' > lakefile.toml
          cp ../library/cgice/Spacetime_Formal_Proof_V20.lean .
          ls -la
      - name: resolve mathlib + cache (v3 toolchain对齐mathlib pin)
        run: |
          cd _build
          lake update
          cp .lake/packages/mathlib/lean-toolchain lean-toolchain
          echo "aligned toolchain: $(cat lean-toolchain)"
          elan toolchain install "$(cat lean-toolchain)" || true
          lake exe cache get
          echo "=== cache verify ==="
          ls .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/Analysis/Calculus/Deriv/ | head -5
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/Analysis/Calculus/Deriv/MeanValue.olean && echo CACHE_OK || echo CACHE_MISSING
      - name: compile (the verdict step)
        id: comp
        run: |
          cd _build
          echo "=== preflight ==="
          ls -la
          lake env lean --version
          echo "=== compile ==="
          set +e
          START=$(date +%s)
          lake env lean Spacetime_Formal_Proof_V20.lean > compile.log 2>&1
          RC=$?
          set -e
          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "elapsed=$(($(date +%s)-START))s" >> $GITHUB_OUTPUT
          echo "=== compile.log head ==="; head -30 compile.log || true
          echo "=== compile.log tail ==="; tail -30 compile.log || true
      - name: verdict receipt to board
        if: always()
        env:
          RC: ${{ steps.comp.outputs.rc }}
          EL: ${{ steps.comp.outputs.elapsed }}
        run: |
          python3 - <<'PYEOF'
          import subprocess,datetime,hashlib,os
          ts=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
          try: log=open('_build/compile.log').read()
          except Exception: log='<no compile.log>'
          rc=os.environ.get('RC','?'); el=os.environ.get('EL','?')
          sha=hashlib.sha256(open('library/cgice/Spacetime_Formal_Proof_V20.lean','rb').read()).hexdigest()
          verdict='COMPILE_OK' if rc=='0' else ('COMPILE_FAIL' if rc.lstrip('-').isdigit() else 'PIPELINE_ABORT')
          head=['CLASSIFY: L1(公域板面·零密钥)','# CGICE-BUILD-VERIFY-01 编译裁决回执 · '+ts,'',
                '靶件: library/cgice/Spacetime_Formal_Proof_V20.lean','sha256: '+sha,
                'toolchain: leanprover/lean4:v4.35.0-rc2','mathlib: 8d7d0c463a379a6fcad593782d5d8a250a767fc2 (pin+1.28h·13:54Z·二分探针)','论文所报pin: 9fe29c4b379922f49446b28b76cbe4fce041c8b3 (实存于master·但其cache CI产物缺失·0/4157·已登记诚实缺口)',
                '裁决: **'+verdict+'** (rc='+rc+' · 编译耗时'+el+')','',
                '## compile.log 尾部','```',log[-1600:],'```']
          body=chr(10).join(head)
          fn='board/cgice-build-verify-'+ts+'.md'
          open(fn,'w').write(body)
          print('=== RECEIPT STDOUT (免鉴权可见) ===')
          print(body)
          subprocess.run(['git','config','user.name','pivot-01'])
          subprocess.run(['git','config','user.email','pivot@vci-inbox'])
          subprocess.run(['git','add',fn])
          subprocess.run(['git','commit','-m','CGICE-BUILD-VERIFY-01 verdict '+verdict+' '+ts])
          ok=False
          for i in range(6):
              subprocess.run(['git','fetch','origin','main'])
              subprocess.run(['git','rebase','origin/main'])
              r=subprocess.run(['git','push','origin','HEAD:main'])
              if r.returncode==0: ok=True; break
              import time; time.sleep(8)
          print('PUSH_OK' if ok else 'PUSH_LOST_AFTER_RETRIES')
          PYEOF
