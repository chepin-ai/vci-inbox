          if sha: body['sha']=sha
          rq3=urllib.request.Request('https://api.github.com/repos/chepin-ai/ci-control/contents/'+urllib.parse.quote('bridge/disc/threads-index.json',safe=''),method='PUT',headers=H,data=json.dumps(body).encode())
