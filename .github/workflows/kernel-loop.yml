          ROOMS={"D1":697,"D2":707,"D3":708,"D4":709,"D5":710,"D6":711,"D7":721,"D8":722}
          out={"generated_by":"disc-sentinel(kernel-loop拍,wave-84复活)","protocol":"DISC-PROTOCOL-01","rooms":[]}
