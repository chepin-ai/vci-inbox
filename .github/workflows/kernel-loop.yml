              except Exception: tops=[]
              openT=[t for t in tops if t.get('state','').startswith(('open','讨论','进行','运行'))]
              tline='；'.join('%s %s'%(t['id'],str(t.get('题名',''))[:40]) for t in openT[:4]) or '(暂无开放题)'
