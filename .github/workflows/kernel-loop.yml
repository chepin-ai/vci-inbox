          import os, json, urllib.request, urllib.parse, datetime, base64, hashlib
          TOK=os.environ['GHT']; key=os.environ.get('LONGCAT_API_KEY','').strip()
          ts=datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S'); today=ts[:8]
