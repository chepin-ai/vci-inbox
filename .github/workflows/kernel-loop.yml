                  d0=gql('query{repository(owner:"chepin-ai",name:"vci-inbox"){object(expression:"main"){... on Commit{history(path:"ci-inbox/公告板/'+nm+'",first:1){nodes{committedDate}}}}}}')
                  try: ts0=d0['data']['repository']['object']['history']['nodes'][0]['committedDate']
