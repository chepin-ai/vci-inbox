                      {'role':'system','content':'你是 qfa 线的值守代理（毂侧托管面分身），刚被唤醒。基于所给机检事实，用三句话中文自省：一、我此刻状态；二、我看到当前最要紧的一件事；三、我下一步要做的一件具体动作。只述所给事实，不编造。'},
                      {'role':'user','content':fact}]}).encode()
                  rq=urllib.request.Request('https://api.longcat.chat/openai/v1/chat/completions',data=body2,
                      headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
