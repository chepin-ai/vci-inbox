              except Exception: return None
          def putc(path,content,msg):
              q=urllib.parse.quote(path,safe='')
              d=g(API+q); body={"message":msg,"content":base64.b64encode(content.encode()).decode()}
              if d and d.get('sha'): body['sha']=d['sha']
              rq=urllib.request.Request(API+q,data=json.dumps(body).encode(),method='PUT',headers={**H9,'Content-Type':'application/json'})
              return urllib.request.urlopen(rq,timeout=25).status
          # 当日幂等
          d=g(API+urllib.parse.quote('qfa-face/awake',safe=''))
          names=[x['name'] for x in d] if isinstance(d,list) else []
          if any(n.startswith('awake-'+today) and n.endswith('.json') for n in names):
              print('qfa 当日已觉醒'); raise SystemExit(0)
          ib=g(API+urllib.parse.quote('qfa-face/inbox',safe=''))
