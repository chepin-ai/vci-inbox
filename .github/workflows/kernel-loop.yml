              print('sync冷却中'); raise SystemExit(0)
          sd=g('ci-control','bridge/sync')
          files=[x['name'] for x in sd] if isinstance(sd,list) else []
          syn=sorted([f for f in files if f.startswith('SYSTEM-SYNC-') and f.endswith('.json')])
          if not syn:
              print('无sync档'); raise SystemExit(0)
          latest=syn[-1]
          if ks.get('sync:last')==latest:
              print('已发布过',latest); raise SystemExit(0)
          sj=g('ci-control','bridge/sync/'+latest)
          doc=json.loads(base64.b64decode(sj['content']).decode())
          line='## SYNC '+latest+' @ '+ts+'\n'+'\n'.join('- '+d for d in doc.get('digest',[])[:12])+'\n'
          bp='ci-inbox/公告板/SYNC-'+latest.replace('.json','.md')
          s1=putc('vci-inbox',bp,'# 全系统同步影子 · '+latest+'\n\n'+line,'SYNC影子 '+latest+' [skip ci]')
          ks['sync:kernel-loop']=now; ks['sync:last']=latest
          s2=putc('ci-control','bridge/knock-state.json',json.dumps(ks,ensure_ascii=False),'sync冷却记账 '+ts)
          print(json.dumps({'sync_pub':latest,'http':[s1,s2]},ensure_ascii=False))
          PYEOF5
