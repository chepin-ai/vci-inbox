                  for c in iss['comments']['nodes']:
                      thr=None
                      for line in c['body'].splitlines()[:6]:
                          ls=line.strip()
                          if ls.startswith('thr:') or ls.startswith('thr：'):
                              thr=ls.split(':',1)[1].split('｜')[0].split('|')[0].strip(); break
                      key=thr or '(无thr帖)'
