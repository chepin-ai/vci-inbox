              old=json.loads(raw2) if False else None
          except: pass
          import urllib.parse
          su='https://api.github.com/repos/chepin-ai/vci-inbox/contents/'+path
          try:
              r=urllib.request.Request(su,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              old=json.loads(urllib.request.urlopen(r).read().decode()); sha=old['sha']
          except: sha=None
          bd={'message':'QFA-OTP-DIAG-01','content':base64.b64encode(json.dumps(out,ensure_ascii=False,indent=1).encode()).decode()}
