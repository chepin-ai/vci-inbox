name: purge-r1-history
on:
  workflow_dispatch:
    inputs:
      target:
        description: "repo to purge (default vci-library)"
        required: false
        default: "vci-library"
permissions:
  contents: write
  # rationale: writes receipt to this repo only; target repo written via hub App token
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "R1 历史层 purge: kit/ 全史摘除 + 私仓备份 + force-with-lease"
        env:
          HUBK: ${{ secrets.CI_OPS_HUB_KEY }}
          HUBID: ${{ vars.CI_OPS_HUB_ID }}
          TGT: ${{ inputs.target }}
        run: |
          python3 -m pip install -q pyjwt git-filter-repo
          python3 - <<'PYEOF'
          import os,json,urllib.request,urllib.error,datetime,hashlib,base64,subprocess
          HK=os.environ['HUBK']; HID=os.environ['HUBID']; TGT=os.environ.get('TGT','vci-library')
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          import jwt as JW
          now=int(datetime.datetime.now().timestamp())
          appjwt=JW.encode({'iat':now-90,'exp':now+540,'iss':HID},HK,algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+appjwt,'Accept':'application/vnd.github+json','User-Agent':'purge'})
          IT=json.loads(urllib.request.urlopen(rq,timeout=20).read())['token']
          def run(c,**kw):
              r=subprocess.run(c,capture_output=True,text=True,**kw); print('>',c[0],c[-1][:60] if len(c)>1 else '',r.returncode); return r
          run(['rm','-rf','/tmp/purge'])
          run(['git','clone','--mirror',f'https://x-access-token:{IT}@github.com/chepin-ai/{TGT}.git','/tmp/purge'])
          # backup mirror to ci-control-backup
          r=run(['git','push',f'https://x-access-token:{IT}@github.com/chepin-ai/ci-control-backup.git',f'+refs/heads/*:refs/heads/{TGT}-pre-purge-20260828/*','+refs/tags/*:refs/tags/{TGT}-pre-purge-20260828/*'],cwd='/tmp/purge')
          print(r.stderr[-300:] if r.returncode else 'backup ok')
          # purge kit/ from all history
          run(['git','filter-repo','--path','kit/','--invert-paths','--force'],cwd='/tmp/purge')
          # verify no kit/ in history
          r=run(['git','log','--all','--oneline','--','kit/'],cwd='/tmp/purge')
          verdict='CLEAN' if not r.stdout.strip() else 'RESIDUAL'
          # re-add tombstone + force push
          r=run(['git','push',f'https://x-access-token:{IT}@github.com/chepin-ai/{TGT}.git','--mirror','--force-with-lease'],cwd='/tmp/purge')
          print('push rc',r.returncode, r.stderr[-200:])
          out={'ts':ts,'target':TGT,'purged_paths':['kit/ (usrm-01×7, usrm-02×2, INDEX, SHARED-LIB-01)'],'backup':f'ci-control-backup refs/{TGT}-pre-purge-20260828/*','verify':verdict,'push':'see log'}
          open('/tmp/purge-receipt.json','w').write(json.dumps(out,ensure_ascii=False,indent=1))
          print(json.dumps(out,ensure_ascii=False))

          PYEOF
      - name: commit receipt
        run: |
          mkdir -p bridge/purge && cp /tmp/purge-receipt.json bridge/purge/receipt-${{ inputs.target }}-20260828.json
          git config user.name purge; git config user.email purge@local
          git add bridge/purge/
          git commit -m "purge receipt [skip ci]" -q || echo noop
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 3; done
