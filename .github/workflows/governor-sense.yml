name: governor-sense
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: governor-sense
  cancel-in-progress: false
jobs:
  sense:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install pyjwt
        run: pip install -q pyjwt
      - name: census x matrix diff + chain attest (GOVERNOR-01 sensing plane)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          python3 - <<'PYEOF'
          import time,json,os,datetime,urllib.request,urllib.error,hashlib,base64
          import jwt
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'governor-sense'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          def api(m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','User-Agent':'governor-sense'})
              if d is not None: r.data=json.dumps(d).encode()
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,{}
          B='https://api.github.com/repos/chepin-ai'
          # 动态发现(态势感知律:仓面不写死,新仓自动入列+未知仓报警)
          pub=set(); page=1
          while page<=3:
              s,d=api('GET','https://api.github.com/users/chepin-ai/repos?per_page=100&page='+str(page))
              if s!=200 or not d: break
              pub|={x['name'] for x in d}; page+=1
          s,inst=api('GET','https://api.github.com/installation/repositories?per_page=100')
          inset={x['name'] for x in inst.get('repositories',[])} if s==200 else set()
          REPOS=sorted(pub|inset)
          KNOWN21={'ci-control','ci-control-backup','ci-library','ci-logs','ci-inbox','ci-bus','ci-playground','ci-build','qlv-lab','vci-inbox','vci-cfts','vci-library','vci-logs','vci-playground','vci-qgl','vci-ucif2','vci-usrm','vci-vinf','ci-yard','ci-worker-01-','ci-worker-02'}
          NEWREPOS=sorted(set(REPOS)-KNOWN21)
          PRIV9=[r for r in REPOS if r in inset and r not in pub]
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          def getfile(repo,path):
              s,d=api('GET',f'{B}/{repo}/contents/{path}')
              if s!=200: return None
              return json.loads(base64.b64decode(d['content']).decode())
          mat=getfile('ci-control','bridge/GLOBAL-MATRIX-01.json')
          perms=getfile('ci-control','bridge/GOV-PERMS-01.json')
          # 自校验:矩阵须 root 亲签(chepin-ai 提交)方视为已批准
          def ratified(path):
              s,d=api('GET',f'{B}/ci-control/commits?path='+path+'&per_page=1')
              if s==200 and d:
                  c=d[0]['commit']; au=(c.get('author') or {}).get('name','')
                  return au, ('[D]' in (c.get('message') or '')), (au=='chepin-ai')
              return None,False,False
              # noqa
          au1,d1,r1=ratified('bridge/GLOBAL-MATRIX-01.json'); au2,d2,r2=ratified('bridge/GOV-PERMS-01.json')
          rat=getfile('ci-control','bridge/governor/RATIFICATION.json') or {}
          if rat.get('approved'): r1=r2=True; au1=au2='root-via-RATIFICATION-01'
          KNOWN=('API_','CI_OPS_','CI_ROOT_','CI_APP_','WARM_BI','AI_FULL_','CMD_AUTH','QR_','OTP_','INBOX_','FED_','GITEE_','GUARD_APP_KEY','QUAFU_TOKEN','URE_','ATP_','VAULT_PRIV','T2W','DISPATCH_PAT','SHARED_KEYS')
          census={}; unknowns=[]; excess=[]; unauth=[]
          for rp in REPOS:
              if rp in inset:
                  s1,sec=api('GET',f'{B}/{rp}/actions/secrets?per_page=100')
                  sn=[x['name'] for x in sec.get('secrets',[])] if s1==200 else []
                  s2,var=api('GET',f'{B}/{rp}/actions/variables?per_page=100')
                  vn=[x['name'] for x in var.get('variables',[])] if s2==200 else []
              else:
                  sn=[]; vn=[]
                  unknowns.append({'repo':rp,'name':'<out-of-installation: workflows-only coverage>'})
              s3,wf=api('GET',f'{B}/{rp}/actions/workflows?per_page=100')
              wl=[{'path':w['path'].split('/')[-1],'state':w['state']} for w in wf.get('workflows',[])] if s3==200 else []
              census[rp]={'secrets':sn,'variables':vn,'workflows':wl}
              for n in sn:
                  if not n.startswith(KNOWN): unknowns.append({'repo':rp,'name':n})
              if perms:
                  for k,reps in perms['secrets_rules'].get('remove_pending_root6',{}).items():
                      if isinstance(reps,list) and rp in reps and k in sn: excess.append({'repo':rp,'secret':k,'class':'pending_root6'})
                  for k,reps in perms['secrets_rules'].get('remove_pending_line_residual',{}).items():
                      if rp in reps and k in sn: excess.append({'repo':rp,'secret':k,'class':'line_residual'})
              if rp in PRIV9:
                  for w in wl:
                      if w['state']=='active' and w['path'] not in ('wall-probe.yml','governor-exec.yml'):
                          unauth.append({'repo':rp,'wf':w['path']})
          rec={'ts':ts,'ratified':{'GLOBAL-MATRIX-01':{'author':au1,'ok':r1},'GOV-PERMS-01':{'author':au2,'ok':r2}},
               'counts':{'unknown':len(unknowns),'excess':len(excess),'unauth_active':len(unauth),'new_repos':len(NEWREPOS)},'new_repos':NEWREPOS,
               'unknowns':unknowns,'excess':excess,'unauth_active':unauth}
          mat_hash=hashlib.sha256(json.dumps(mat,sort_keys=True,ensure_ascii=False).encode()).hexdigest() if mat else None
          cen_hash=hashlib.sha256(json.dumps(census,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          # G-A: 未授权活跃的私仓workflow 自动再disable(root律:私仓CI只做应急响应)
          acted=[]
          if r1 and r2:
              for u in unauth:
                  s4,d4=api('GET',f"{B}/{u['repo']}/actions/workflows")
                  wid=[w['id'] for w in d4.get('workflows',[]) if w['path'].endswith(u['wf'])]
                  if wid:
                      s5,_=api('PUT',f"{B}/{u['repo']}/actions/workflows/{wid[0]}/disable")
                      acted.append({'repo':u['repo'],'wf':u['wf'],'disable':s5})
          rec['G_A_acted']=acted
          rec['mode']='ratified-enforce' if (r1 and r2) else 'report-only(matrix待root批准)'
          # 链-哈希
          chain='GENESIS'
          try:
              rq0=urllib.request.Request(f'{B}/ci-control/contents/bridge/governor/governor-log.json',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              _old=json.loads(__import__('base64').b64decode(json.loads(urllib.request.urlopen(rq0).read().decode())['content']).decode())
              if _old: chain=_old[-1].get('hash','GENESIS')
          except Exception: pass
          rec['prev']=chain
          rec['hash']=hashlib.sha256(json.dumps({k:v for k,v in rec.items() if k!='hash'},sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          attest={'ts':ts,'matrix_sha256':mat_hash,'census_sha256':cen_hash,'verdict':'PASS' if (not unknowns and not unauth) else 'ATTENTION',
                  'diffs':rec['counts'],'self_check':rec['ratified'],'mode':rec['mode'],'chain_head':rec['hash']}
          os.makedirs('bridge/governor',exist_ok=True)
          json.dump(attest,open('bridge/governor/attest-latest.json','w'),ensure_ascii=False,indent=1)
          # L2明细全进私仓(CLASSIFY-01,D-072):census+log chain
          import base64 as _b
          def putc2(repo,path,obj,msg):
              rq0=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              sha=None
              try:
                  x=urllib.request.urlopen(rq0); sha=json.loads(x.read().decode()).get('sha')
              except Exception: pass
              bd={'message':msg,'content':_b.b64encode(json.dumps(obj,ensure_ascii=False,indent=1).encode()).decode()}
              if sha: bd['sha']=sha
              rq=urllib.request.Request(f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}',method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(bd).encode())
              urllib.request.urlopen(rq)
          putc2('ci-control','bridge/governor/census-latest.json',census,'governor census '+ts)
          oldlog=[]
          try:
              rq0=urllib.request.Request(f'{B}/ci-control/contents/bridge/governor/governor-log.json',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              oldlog=json.loads(_b.b64decode(json.loads(urllib.request.urlopen(rq0).read().decode())['content']).decode())
          except Exception: pass
          oldlog.append(rec)
          putc2('ci-control','bridge/governor/governor-log.json',oldlog,'governor log+1')
          print(json.dumps(attest,ensure_ascii=False))
          if attest['verdict']!='PASS':
              body='[governor-sense] '+ts+' verdict='+attest['verdict']+' diffs='+json.dumps(rec['counts'],ensure_ascii=False)+' mode='+rec['mode']
              api('POST',f'{B}/vci-inbox/issues/1/comments',{'body':body})
          PYEOF
      - name: solver-tick (U4动态矩阵+决策链; U1 checkpoint; U3环引kernel)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import time,json,os,datetime,urllib.request,urllib.error,hashlib,base64
          import jwt
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','User-Agent':'solver-tick'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          B='https://api.github.com/repos/chepin-ai'
          def getc(repo,path):
              r=urllib.request.Request(f'{B}/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); j=json.loads(x.read().decode()); return json.loads(base64.b64decode(j['content']).decode())
              except Exception: return None
          def putc(repo,path,obj,msg):
              for _try in range(3):
                  rq0=urllib.request.Request(f'{B}/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
                  sha=None
                  try:
                      x=urllib.request.urlopen(rq0); sha=json.loads(x.read().decode()).get('sha')
                  except Exception: pass
                  bd={'message':msg,'content':base64.b64encode(json.dumps(obj,ensure_ascii=False,indent=1).encode()).decode()}
                  if sha: bd['sha']=sha
                  rq=urllib.request.Request(f'{B}/{repo}/contents/{path}',method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(bd).encode())
                  try:
                      urllib.request.urlopen(rq); return
                  except urllib.error.HTTPError as e:
                      if e.code==409 and _try<2: time.sleep(3+_try*3); continue
                      raise
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          census=getc('ci-control','bridge/governor/census-latest.json')
          if not census: print('no census yet'); raise SystemExit(0)
          import yaml as _y
          _pt=getc_raw if False else None
          def gety(repo,path):
              r=urllib.request.Request(f'{B}/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); return _y.safe_load(base64.b64decode(json.loads(x.read().decode())['content']).decode())
              except Exception: return None
          pol=gety('ci-control','bridge/policies.yaml') or {}
          KNOWN=("API_","CI_OPS_","CI_ROOT_","CI_APP_","WARM_BI","AI_FULL_","CMD_AUTH","QR_","OTP_","INBOX_","FED_","GITEE_","GUARD_APP_KEY","QUAFU_TOKEN","URE_","ATP_","VAULT_PRIV","T2W","DISPATCH_PAT","SHARED_KEYS","LOBBY")
          ferry=set(pol.get('ferry_allow',['vci-inbox'])) if isinstance(pol,dict) else {'vci-inbox'}
          desired={}
          for repo,st in census.items():
              pub=repo.startswith('vci-') or repo.startswith('ci-worker') or repo=='ci-yard'
              keep=[];remove=[];flag=[]
              for s in st.get('secrets',[]):
                  if not s.startswith(KNOWN): flag.append({'secret':s,'rule':'R7'})
                  if s=='CI_OPS_HUB_KEY' and pub and repo not in ferry: remove.append({'secret':s,'rule':'R6/R3'})
                  elif s in ('AI_FULL_PAT','CI_OPS_APP_KEY','AI_FULL_APP_KEY'): remove.append({'secret':s,'rule':'R4/R2/R8'})
                  elif s=='CMD_AUTH' and pub and repo not in (pol.get('allows',{}).get('cmd_auth_keep',{}) if isinstance(pol,dict) else {}): flag.append({'secret':s,'rule':'F-11'})
                  else: keep.append(s)
              for v in st.get('variables',[]):
                  if v in ('CI_OPS_APP_ID','AI_FULL_APP_ID'): remove.append({'variable':v,'rule':'R4/R8'})
              wv=[{'wf':w['path'],'rule':'R5'} for w in st.get('workflows',[]) if (not pub) and w['state']=='active' and w['path']!='wall-probe.yml']
              desired[repo]={'keep':keep,'remove':remove,'flag':flag,'wf_violations':wv}
          cen_h=hashlib.sha256(json.dumps(census,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          pol_h=hashlib.sha256(json.dumps(pol,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          # U3 环引: 取kernel最新report hash
          k_h=None
          try:
              r=urllib.request.Request(f'{B}/ci-control/contents/bridge/findings',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              fl=json.loads(urllib.request.urlopen(r).read().decode())
              kn=[f['name'] for f in fl if f['name'].startswith('kernel-')]
              if kn: k_h=hashlib.sha256((gett('ci-control','bridge/findings/'+sorted(kn)[-1]) or '').encode()).hexdigest()
          except Exception: pass
          mat={'provenance':{'solver':'MATRIX-SOLVER-01 v1.1(tick内嵌)','ts':ts,'census_sha256':cen_h,'policies_sha256':pol_h,'kernel_report_sha256':k_h},'desired':desired}
          putc('ci-control','bridge/MATRIX-SOLVED-01.json',mat,'[D] matrix tick '+ts)
          # U4 决策链
          dlog=getc('ci-control','bridge/governor/decision-log.json') or []
          prev=dlog[-1]['hash'] if dlog else 'GENESIS'
          nrem=sum(len(v['remove']) for v in desired.values()); nwv=sum(len(v['wf_violations']) for v in desired.values())
          drec={'ts':ts,'decision_id':'dec-'+str(len(dlog)+1),'census_sha256':cen_h,'policies_sha256':pol_h,'kernel_sha256':k_h,
                'diff':{'remove':nrem,'wf_violations':nwv},'prev':prev}
          drec['hash']=hashlib.sha256(json.dumps(drec,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          dlog.append(drec); putc('ci-control','bridge/governor/decision-log.json',dlog,'decision '+drec['decision_id'])
          # U1 checkpoint(三行制: origin+size+root+签名)
          def gett(repo,path):
              r=urllib.request.Request(f'{B}/{repo}/contents/{path}',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              try:
                  x=urllib.request.urlopen(r); return base64.b64decode(json.loads(x.read().decode())['content']).decode()
              except Exception: return None
          raw_chain=gett('vci-inbox','disc/CHAIN.jsonl') or ''
          lines=[l for l in raw_chain.strip().split(chr(10)) if l.strip()]
          size=len(lines)
          root_h=hashlib.sha256(raw_chain.encode()).hexdigest() if raw_chain else None
          import cryptography.hazmat.primitives.serialization as ser
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          key=ser.load_pem_private_key(os.environ['HUB_KEY'].encode(),password=None)
          msg=f"ci-os/chain\n{size}\n{root_h}\n".encode()
          sig=base64.b64encode(key.sign(msg,padding.PKCS1v15(),hashes.SHA256())).decode()
          cp={'origin':'ci-os/chain','size':size,'root_sha256':root_h,'ts':ts,'signer':'chepin-ci-ops-hub','sig_b64':sig,'witnesses':['kernel(K7 verify)','sentinel(候U5)']}
          putc('ci-control','bridge/chain/checkpoint-latest.json',cp,'checkpoint size%s'%size)
          json.dump({'origin':'ci-os/chain','size':size,'root_sha256':root_h,'ts':ts},open('bridge/chain-anchor.json','w'),ensure_ascii=False,indent=1)
          print(json.dumps({'dec':drec['decision_id'],'remove':nrem,'wfv':nwv,'cp_size':size},ensure_ascii=False))
          PYEOF
      - name: mutual-watch (U5-lite:哨兵互守,过期即补跑,不信cron准时)
        env:
          HUB_KEY: ${{ secrets.CI_OPS_HUB_KEY }}
          HUB_ID: ${{ vars.CI_OPS_HUB_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,datetime,urllib.request,urllib.error
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['HUB_ID']},os.environ['HUB_KEY'],algorithm='RS256')
          rq=urllib.request.Request('https://api.github.com/app/installations/154355791/access_tokens',method='POST',headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'})
          IT=json.load(urllib.request.urlopen(rq))['token']
          B='https://api.github.com/repos/chepin-ai'
          def gh(m,u,d=None):
              r=urllib.request.Request(u,method=m,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
              if d is not None: r.data=json.dumps(d).encode(); r.add_header('Content-Type','application/json')
              try:
                  x=urllib.request.urlopen(r); b=x.read().decode(); return x.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e: return e.code,{}
          WATCHL={'devsecops-gate.yml':7,'reset-sentinel.yml':7,'quota-guard.yml':26,'beacon-mint.yml':2,'rci-engine.yml':2,'bridge-guard.yml':3,'bridge-poller.yml':3,'disc-clerk.yml':26}
          s,wl=gh('GET',f'{B}/vci-inbox/actions/workflows?per_page=100')
          nowdt=datetime.datetime.now(datetime.timezone.utc)
          for wf in wl.get('workflows',[]):
              fn=wf['path'].split('/')[-1]
              if fn not in WATCHL: continue
              s2,rr=gh('GET',f"{B}/vci-inbox/actions/workflows/{wf['id']}/runs?per_page=1")
              runs=rr.get('workflow_runs',[]) if s2==200 else []
              stale=True
              if runs:
                  at=datetime.datetime.fromisoformat(runs[0]['created_at'].replace('Z','+00:00'))
                  stale=(nowdt-at).total_seconds()>WATCHL[fn]*3600
              if stale:
                  s3,_=gh('POST',f"{B}/vci-inbox/actions/workflows/{wf['id']}/dispatches",{'ref':'main'})
                  print('补跑',fn,s3)
              else: print('鲜',fn)
          PYEOF
      - name: commit governor state
        run: |
          git config user.name governor-sense; git config user.email governor@local
          git add bridge/governor/attest-latest.json bridge/chain-anchor.json
          git commit -m "governor-sense: $(date -u +%Y%m%d-%H%M) tick [skip ci]" -q || echo noop
          ok=0; for i in 1 2 3; do git pull --rebase -q origin main && git push -q && { ok=1; break; }; sleep $((i*4)); done; [ "$ok" = 1 ] || echo "push retry exhausted" 
